<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel</title>
<script>try{const t=localStorage.getItem("panel-theme");if(t)document.documentElement.dataset.theme=t;if(localStorage.getItem("panel-collapsed")==="1")document.documentElement.dataset.collapsed="1"}catch{}</script>
<style>
/* Mac Workstation: tokens de Apple (HIG). Texto secundario/terciario subido lo justo para pasar AA. */
:root{
  --bg:#f2f2f7;--panel:#fff;--sunken:rgba(118,118,128,.12);--hover:rgba(0,0,0,.04);--sel:rgba(0,0,0,.06);
  --text:#000;--muted:rgba(60,60,67,.82);--faint:rgba(60,60,67,.74);--tx3:rgba(60,60,67,.38);--line:rgba(60,60,67,.12);--sep:rgba(60,60,67,.12);
  --accent:#007aff;--accent-fill:#0071e3;--accent-soft:rgba(0,122,255,.14);--on-accent:#fff;
  --warn:#ff9500;--warn-text:#c93400;--warn-soft:rgba(255,149,0,.15);--danger:#d70015;--danger-soft:rgba(255,59,48,.12);--ok:#34c759;--pos:#1e7b34;
  --series-1:#5856d6;--series-2:#248a3d;--grid:rgba(60,60,67,.12);--chip:rgba(118,118,128,.12);--track:rgba(60,60,67,.16);--tick:rgba(60,60,67,.55);
  --seg-on:#fff;--side-bg:rgba(255,255,255,.6);--toast:rgba(255,255,255,.88);
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.08);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --r1:6px;--r2:8px;--r3:10px;--ease:cubic-bezier(.65,0,.35,1);--side:240px;--rail:68px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1c1c1e;--panel:#2c2c2e;--sunken:rgba(118,118,128,.24);--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.1);
  --text:#fff;--muted:rgba(235,235,245,.6);--faint:rgba(235,235,245,.55);--tx3:rgba(235,235,245,.38);--line:rgba(255,255,255,.12);--sep:rgba(255,255,255,.08);
  --accent:#0a84ff;--accent-fill:#0071e3;--accent-soft:rgba(10,132,255,.18);--on-accent:#fff;
  --warn:#ff9f0a;--warn-text:#ff9f0a;--warn-soft:rgba(255,159,10,.16);--danger:#ff6961;--danger-soft:rgba(255,69,58,.18);--ok:#30d158;--pos:#30d158;
  --series-1:#7d7aff;--series-2:#30d158;--grid:rgba(255,255,255,.08);--chip:rgba(118,118,128,.24);--track:rgba(255,255,255,.14);--tick:rgba(235,235,245,.45);
  --seg-on:#636366;--side-bg:rgba(44,44,46,.6);--toast:rgba(58,58,60,.88);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1c1e;--panel:#2c2c2e;--sunken:rgba(118,118,128,.24);--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.1);
  --text:#fff;--muted:rgba(235,235,245,.6);--faint:rgba(235,235,245,.55);--tx3:rgba(235,235,245,.38);--line:rgba(255,255,255,.12);--sep:rgba(255,255,255,.08);
  --accent:#0a84ff;--accent-fill:#0071e3;--accent-soft:rgba(10,132,255,.18);--on-accent:#fff;
  --warn:#ff9f0a;--warn-text:#ff9f0a;--warn-soft:rgba(255,159,10,.16);--danger:#ff6961;--danger-soft:rgba(255,69,58,.18);--ok:#30d158;--pos:#30d158;
  --series-1:#7d7aff;--series-2:#30d158;--grid:rgba(255,255,255,.08);--chip:rgba(118,118,128,.24);--track:rgba(255,255,255,.14);--tick:rgba(235,235,245,.45);
  --seg-on:#636366;--side-bg:rgba(44,44,46,.6);--toast:rgba(58,58,60,.88);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);letter-spacing:-.23px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r1)}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
code{font:12.5px var(--mono);letter-spacing:0;background:var(--chip);padding:1px 5px;border-radius:5px}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* ---------- Layout + sidebar (vibrancy) ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .32s var(--ease)}
:root[data-collapsed="1"] .app{grid-template-columns:var(--rail) minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:var(--s1);padding:var(--s4) var(--s3);border-right:1px solid var(--sep);background:var(--side-bg);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);z-index:3}
.brand{display:flex;align-items:center;gap:10px;padding:var(--s1) 10px var(--s5);min-height:52px}
.mark{width:28px;height:28px;border-radius:7px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:0;flex:none}
.brand b{font-size:15px;font-weight:600;white-space:nowrap}
.trigger{position:absolute;top:22px;right:-13px;width:26px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:grid;place-items:center;box-shadow:var(--shadow);transition:color .2s,transform .32s var(--ease);z-index:2}
.trigger:hover{color:var(--text)}.trigger svg{width:15px;height:15px;transition:transform .32s var(--ease)}
:root[data-collapsed="1"] .trigger svg{transform:rotate(180deg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.side-btn{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r2);color:var(--muted);text-decoration:none;border:0;background:none;width:100%;white-space:nowrap;overflow:hidden;transition:background .15s,color .15s}
.nav a:hover,.side-btn:hover{background:var(--hover);color:var(--text)}
.nav a[aria-current="page"]{background:var(--sel);color:var(--text);font-weight:500}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav .count{margin-left:auto;font-size:12px;letter-spacing:0;color:var(--faint);font-variant-numeric:tabular-nums}
.label{transition:opacity .2s}
:root[data-collapsed="1"] .label,:root[data-collapsed="1"] .nav .count,:root[data-collapsed="1"] .brand b{opacity:0;pointer-events:none}
.side-foot{margin-top:auto;border-top:1px solid var(--sep);padding-top:var(--s3)}
.main{min-width:0;padding:var(--s6) var(--s6) var(--s8)}
.page{max-width:1240px;margin:0 auto}

@media (max-width:760px){
  .app,:root[data-collapsed="1"] .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:var(--s1) var(--s2) calc(var(--s1) + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--sep);z-index:10}
  .brand,.trigger,.side-foot .label{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;height:52px;padding:var(--s1) 0;font-size:10.5px;letter-spacing:0;justify-content:center;flex:1 1 0;min-width:0}
  .nav .count{display:none}
  :root[data-collapsed="1"] .label{opacity:1}
  .side-foot{display:none}
  .side-foot .side-btn{width:48px;height:52px;justify-content:center;padding:0}
  .main{padding:var(--s5) var(--s4) calc(96px + env(safe-area-inset-bottom))}
}

/* ---------- Page chrome ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s6)}
.eyebrow{font-size:13px;letter-spacing:-.08px;color:var(--muted);margin:0 0 var(--s1)}.eyebrow::first-letter{text-transform:uppercase}
h1{font-size:28px;line-height:1.15;letter-spacing:-.4px;margin:0;font-weight:600}
h2{font-size:15px;margin:0;font-weight:600;letter-spacing:-.23px}
.sub{color:var(--muted);margin:var(--s2) 0 0;max-width:68ch}
.card{background:var(--panel);border-radius:var(--r3);padding:var(--s4);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.link{color:var(--text);font-size:13px;font-weight:500;letter-spacing:-.08px;background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:1px;text-underline-offset:3px}
.link:hover{text-decoration-color:currentColor}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.empty{color:var(--muted);text-align:center;padding:var(--s6) var(--s4);background:var(--panel);border-radius:var(--r3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s3);margin-bottom:var(--s5)}
.stat{background:var(--panel);border-radius:var(--r3);padding:14px var(--s4)}
.stat span{display:block;font-size:13px;letter-spacing:-.08px;color:var(--muted)}
.stat small{display:block;font-size:13px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums;margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--danger)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 var(--s2);border-radius:999px;background:var(--chip);color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0;white-space:nowrap}
.chip.client{background:var(--warn-soft);color:var(--warn-text)}
.btn{text-decoration:none;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r2);border:0;background:var(--chip);font-size:14px;font-weight:500;transition:box-shadow .15s,filter .15s;white-space:nowrap}
.btn:hover{box-shadow:inset 0 0 0 99px var(--hover)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent-fill);color:#fff;font-weight:600}
.btn.primary:hover{box-shadow:none;filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:progress}
.field{height:36px;padding:0 var(--s3);border-radius:var(--r2);border:1px solid transparent;background:var(--chip);min-width:0}
.field::placeholder{color:var(--faint)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:var(--s2);flex-wrap:wrap}.row .grow{flex:1 1 180px}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--chip);gap:2px}
.seg button{border:0;background:none;height:30px;padding:0 var(--s3);border-radius:7px;color:var(--text);font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}

/* ---------- Lista agrupada inset: varias filas en un contenedor, divisores finos ---------- */
.ins{background:var(--panel);border-radius:var(--r3)}
.ins:empty{display:none}
.ins>*{position:relative;padding-left:var(--s4);padding-right:var(--s4)}
.ins>*+*::before{content:"";position:absolute;top:0;left:var(--s4);right:0;border-top:1px solid var(--sep);pointer-events:none}
.ins>.c-row+.c-row::before{left:56px}
.ins>:first-child{border-radius:var(--r3) var(--r3) 0 0}.ins>:last-child{border-radius:0 0 var(--r3) var(--r3)}.ins>:only-child{border-radius:var(--r3)}
.p-ico{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:600;letter-spacing:0;line-height:1}

/* ---------- Inicio ---------- */
.home{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--s4)}
.home .col{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
@media (max-width:1000px){.home{grid-template-columns:minmax(0,1fr)}}
.group+.group{margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--sep)}
.today{max-width:680px;margin:0 auto;padding-top:var(--s4)}
.t-head{text-align:center}.t-head h1{font-size:28px;letter-spacing:-.4px;margin:0}
.lead{font-size:15px;color:var(--muted);margin:6px 0 0}
.t-sec{margin-top:var(--s6)}
.t-label{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);font-size:13px;font-weight:600;letter-spacing:-.08px;color:var(--muted);padding:0 var(--s4) 6px}
.t-label>span:last-child{font-weight:500}
.t-label a{color:var(--muted);text-decoration:none;font-weight:500}.t-label a:hover{color:var(--text)}
.t-row{display:flex;align-items:center;gap:var(--s3);min-height:48px;padding:10px var(--s4)}
.t-txt{flex:1;min-width:0;margin:0;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.t-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t-who{font-weight:500;color:var(--muted)}
.t-det{margin:0;font-size:13px;letter-spacing:-.08px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-row.sug .t-txt{-webkit-line-clamp:1}
.t-row .t-txt,.k-row .t-txt{font-weight:500}.t-row .t-det,.k-row .t-det,.c-next{font-size:14px;letter-spacing:-.15px}
.t-label+.t-hint{margin-top:0}
.pend+.pend{margin-top:var(--s3)}
.pend-h .t-txt{font-weight:600}.pend-h .btn{height:30px;font-size:13px}
.pend-md{padding:10px var(--s4);font-size:13px;color:var(--muted)}.pend-md summary{cursor:pointer}
.pend-md pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;line-height:1.5;color:var(--text);margin:var(--s2) 0 0}
.t-sum{flex:none;position:relative;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:999px;border:0;background:var(--accent-fill);color:#fff;font-size:13px;font-weight:600;letter-spacing:-.08px;cursor:pointer;transition:filter .15s}
.t-sum::after{content:"";position:absolute;inset:-7px -2px}
.t-sum svg{display:none}
.t-sum:hover{filter:brightness(1.08)}
.t-row.ok .t-txt{text-decoration:line-through;color:var(--faint)}
.tick{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--tick);background:none;display:grid;place-items:center;color:transparent;cursor:pointer;padding:0;transition:background .15s,border-color .15s,color .15s}
.tick svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.tick:hover{border-color:var(--accent);color:var(--accent)}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.t-x{flex:none;width:28px;height:28px;border:0;background:none;border-radius:var(--r2);color:var(--faint);font-size:18px;line-height:1;opacity:0;cursor:pointer}
.t-row:hover .t-x,.t-x:focus-visible{opacity:1}.t-x:hover{background:var(--hover);color:var(--text)}
@media (hover:none){.t-x{opacity:1}}
.t-hint{font-size:13px;letter-spacing:-.08px;color:var(--muted);margin:var(--s5) 0 6px;padding:0 var(--s4)}.t-hint a{color:var(--text)}.t-hint svg{width:13px;height:13px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:2}
.t-add{display:flex;align-items:center;gap:var(--s2);min-height:48px;padding:0 var(--s2) 0 var(--s4);margin-top:var(--s3);background:var(--panel);border-radius:var(--r3)}
.t-add input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:15px;padding:10px 0;outline:none}
.t-add input::placeholder{color:var(--faint)}
.t-add:focus-within{box-shadow:0 0 0 3px var(--accent-soft)}
.t-add select{flex:none;align-self:stretch;max-width:38%;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.c-row{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:10px var(--s4);text-decoration:none;color:inherit;transition:background .15s}
a.c-row:hover{background:var(--hover)}
.c-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.c-main b{font-size:15px;font-weight:500}
.c-next{font-size:13px;letter-spacing:-.08px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-pain{flex:none;font-size:12px;font-weight:500;letter-spacing:0;padding:3px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn-text);white-space:nowrap}
.c-go{flex:none;font-size:20px;line-height:1;color:var(--tx3)}
.t-foot{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-top:var(--s6);font-size:13px}
.t-foot a{color:var(--muted);text-decoration:none}.t-foot a:hover{color:var(--text)}
/* Disco y memoria: un solo bloque agrupado, barras con el riel visible. */
.t-sys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5);margin-top:var(--s5);padding:14px var(--s4);background:var(--panel);border-radius:var(--r3);text-align:left}
.sys>div{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:var(--s2)}
.sys span{font-size:12px;letter-spacing:0;color:var(--muted)}.sys b{font-size:20px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.sys i{display:block;height:4px;border-radius:999px;background:var(--track);overflow:hidden}
.sys em{display:block;height:100%;border-radius:999px;background:var(--accent)}
.sys.warn em{background:var(--warn)}.sys.bad em{background:var(--danger)}.sys.warn b{color:var(--warn-text)}.sys.bad b{color:var(--danger)}
.sys small{display:block;margin-top:6px;font-size:12px;letter-spacing:0;color:var(--faint)}
@media (max-width:520px){.t-sys{grid-template-columns:minmax(0,1fr);gap:var(--s4)}}

/* ---------- Proyectos ---------- */
.projects{display:grid;grid-template-columns:208px 164px minmax(0,1fr);gap:var(--s5);align-items:start}
.plist{position:sticky;top:var(--s6);max-height:calc(100vh - 2 * var(--s6));overflow:auto;padding:0 var(--s1) var(--s4) 0}
.plist .field{width:100%;height:32px;margin-bottom:var(--s2)}
.pgroup{margin-top:var(--s2)}
.pgroup h3{font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted);margin:0 var(--s2) var(--s1)}
.prow a{display:flex;align-items:center;gap:10px;height:36px;padding:0 var(--s2);border-radius:var(--r2);text-decoration:none;color:var(--muted);font-size:14px;transition:background .15s,color .15s}
.prow a:hover{background:var(--hover);color:var(--text)}
.prow a[aria-current="true"]{background:var(--sel);color:var(--text);font-weight:600}
.prow .p-ico{width:22px;height:22px;border-radius:6px;font-size:11px}
.prow a span:not(.p-ico){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow a small{font-size:12px;letter-spacing:0;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:400}
.prow.dragging{opacity:.4}
.prow.drop-before{box-shadow:0 -2px 0 var(--accent)}.prow.drop-after{box-shadow:0 2px 0 var(--accent)}
.prow[draggable="true"] a{cursor:grab}
.pmore{display:flex;flex-direction:column;margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--sep)}
.pmore button{display:flex;justify-content:space-between;height:32px;padding:0 var(--s2);border:0;border-radius:var(--r2);background:none;color:var(--muted);font-size:13px;text-align:left}
.pmore button:hover,.pmore button[aria-pressed="true"]{color:var(--text);background:var(--hover)}
.psec{position:sticky;top:var(--s6);display:flex;flex-direction:column;gap:2px;padding:0 0 0 var(--s4);border-left:1px solid var(--sep);min-height:180px}
.psec h3{font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted);margin:10px var(--s2) var(--s2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<body>

    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><button class="side-btn" data-act="theme" title="Cambiar tema"><svg viewBox="0 0 24 24" id="themeIcon"></svg><span class="label">Tema</span></button></div>
  </aside>
  <main class="main"><div class="page" id="page"></div></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const I={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',check:'<path d="M20 6 9 17l-5-5"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',plus:'<path d="M12 5v14M5 12h14"/>',pin:'<path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/>',archive:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',leaf:'<path d="M11 20A7 7 0 0 1 4 13c0-6 7-10 16-10 0 9-4 16-10 16"/><path d="M4 21c4-4 7-7 11-10"/>'
};
I.inbox='<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>';
I.flow='<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/>';
const svg=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:)]|$)/g,"$1<em>$2</em>").replace(/\*\*/g,"");
const ars=n=>n.toLocaleString("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};

const BK={pains:"Dolores del cliente",backlog:"Backlog",doing:"Haciendo",done:"Hecho",ideas:"Mejoras / ideas"};
const NEXT={pains:["backlog","Al backlog","arrow"],backlog:["doing","Empezar","arrow"],doing:["done","Terminar","check"],ideas:["backlog","Al backlog","arrow"],done:["doing","Reabrir","undo"]};
const STALE=30;
let S=null,CAL=null,month="",ui={ptab:store.get("panel-ptab")||"tareas",groups:JSON.parse(store.get("panel-groups")||"{}"),finTab:store.get("panel-fintab")||"resumen",estTab:store.get("panel-esttab")||"hoy",scope:"shared",showDone:false,editing:null,confirm:null,q:""},BOARD=[],dragI=null;

// Un ítem: tags [cliente] al frente → chips; **negrita** inicial → título, el resto → cuerpo.
function shape(text){
  let t=text.trim(),tags=[],m;
  while((m=t.match(/^(?:\*\*)?\[([^\]]{1,28})\](?:\*\*)?\s*/))){tags.push(m[1]);t=t.slice(m[0].length)}
  if(t.startsWith("**")&&t.indexOf("**",2)<0)t=t.slice(2);
  const b=t.match(/^\*\*(.+?)\*\*\s*[—–:-]?\s*(.*)$/s);
  return b?{tags,title:b[1],body:b[2]}:{tags,title:t,body:""};
}
const isClientTag=(t,p)=>!/^(owner|yo|mía|mia|p\d)$/i.test(t);

const cutoff=()=>{const d=new Date();d.setDate(d.getDate()-STALE);return d.toLocaleDateString("sv-SE")};
const inArchDir=p=>p.name.startsWith("_archivo/"),isArch=p=>S.archived.includes(p.name)||inArchDir(p),isPin=p=>S.pinned.includes(p.name);

const byOrder=l=>{const o=S.order||[];return l.map((p,i)=>({p,i,k:o.indexOf(p.name)})).sort((a,b)=>(a.k<0?1e9+a.i:a.k)-(b.k<0?1e9+b.i:b.k)).map(x=>x.p)};
const pname=n=>n.includes("/")?`<span class="faint">${esc(n.split("/")[0])}/</span>${esc(n.split("/").slice(1).join("/"))}`:esc(n);
const open=p=>[...p.shared,...p.mine].filter(i=>i.bucket!=="done").length;

async function loadCal(){try{CAL=await (await fetch("/api/calendar")).json()}catch{CAL={configured:false,events:[],cals:[]}}render()}
async function load(){
  const r=await fetch("/api/state"+(month?"?month="+month:""));S=await r.json();month=S.finanzas.month;
  const cp=route().page==="proyectos"&&curProject();
  if(cp&&(PSECS.some(([k])=>k===route().sec)?route().sec:ui.ptab)!=="tareas"||cp&&PJ?.name!==cp.name)await loadProj(cp.name);render();
}
async function post(path,body){
  const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({error:"Error"}));
  if(!r.ok){toast(d.error||"Error");await load();throw new Error(d.error)}
  await load();return d;
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600)}

function route(){const [,page="inicio",arg="",sec=""]=location.hash.split("/");return{page,arg:decodeURIComponent(arg),sec}}

function renderNav(){
  const {page:pg}=route(),page=pg==="p"?"proyectos":pg,a=S?active():[];
  const items=[["inicio","Inicio","home",""],["proyectos","Proyectos","board",a.length],["calendario","Calendario","cal",""],["mcps","MCPs","plug",S?.mcps.length??""],["finanzas","Finanzas","wallet",""],["mascotas","Mascotas","paw",S?.mascotas.pets.length||""],["estudio","Estudio","book",S?S.estudio.cerebros.reduce((n,c)=>n+c.due.length,0)||"":""],["nutricion","Nutrición","leaf",""],["flujos","Flujos","flow",S?.flujos.list.length||""],["contenido","Contenido","inbox",S?.contenido.secs.Bandeja.length||""]];
  document.getElementById("nav").innerHTML=items.map(([k,l,ic,c])=>`<a href="#/${k}" ${page===k?'aria-current="page"':""} title="${l}">${svg(ic)}<span class="label">${l}</span><span class="count">${c}</span></a>`).join("");
  const dark=getComputedStyle(document.documentElement).colorScheme==="dark";
  document.getElementById("themeIcon").innerHTML=dark?I.sun:I.moon;
}

function render(){
  if(!S)return;
  renderNav();
  const {page}=route(),el=document.getElementById("page");document.documentElement.dataset.page=page;
  const sx=document.querySelector(".board")?.scrollLeft??0,ks=[...document.querySelectorAll("[data-keep-scroll]")].map(x=>[x.dataset.keepScroll,x.scrollLeft,x.scrollTop]);

/* ---------------- Inicio ---------------- */
// Foco de hoy: una tarea se identifica por proyecto + scope + su primera línea (ver focoOp en panel.ts).
const FOCO_MAX=3;
const keyOf=i=>i.raw.split("\n")[0].replace(/^- \[[ xX]\] /,"").trim();
const findItem=(project,scope,key)=>{const p=S.projects.find(x=>x.name===project);return p&&(scope==="mine"?p.mine:p.shared).find(i=>keyOf(i)===key)};
const inFoco=(project,scope,i)=>S.foco.some(f=>f.project===project&&f.scope===scope&&f.key===keyOf(i));
const dm=day=>day?day.slice(5).split("-").reverse().join("/"):"";
// Una línea legible: si el título es solo una fecha ("**2026-09-28** [Mauro] …"), va el cuerpo.
const title=i=>{const s=shape(i.text);return /^\d{4}-\d{2}-\d{2}$/.test(s.title)&&s.body?`${dm(s.title)} · ${s.tags.length?`[${s.tags.join("] [")}] `:""}${s.body}`:s.title};

// Texto plano de una línea: sin markdown, sin emoji inicial (el Inicio no muestra código ni negritas).
const plain=s=>String(s).replace(/\*\*|`/g,"").replace(/^\p{Extended_Pictographic}️?\s*/u,"").trim();
// Nombre visible: el de panel-alias o, si no hay, la carpeta en Título ("mi-app" → "Mi App").
const alias=n=>S.alias?.[n]||n.split("/").pop().replace(/[-_]+/g," ").replace(/(^|\s)\p{L}/gu,c=>c.toUpperCase());
// Título corto: hasta el primer " — ", " (" o "; " si lo que queda sigue diciendo algo (≥ 12 letras).
const short=i=>{const t=plain(title(i)),m=t.search(/ — | \(|; /);return m>=12?t.slice(0,m):t};
// Detalle de una línea: lo que falta ("Falta: …") o, si no hay, cómo sigue el texto después del título.
const detail=i=>{const t=plain(i.text).replace(/\s+/g," "),f=t.match(/Falta:\s*(.+?)(?:\.\s|$)/i);
  if(f)return "Falta: "+f[1];const s=short(i),rest=t.slice(t.indexOf(s)+s.length).replace(/^\s*\([^)]*\)/,"").replace(/^[\s—:;,.-]+/,"");return rest.split(/(?<=\.)\s/)[0]};
const pickNext=p=>{const all=[...p.shared.map(i=>["shared",i]),...p.mine.map(i=>["mine",i])];return all.find(([,i])=>i.bucket==="doing")||all.find(([,i])=>i.bucket==="backlog")};
const dataOf=(project,scope,key)=>`data-p="${esc(project)}" data-s="${scope}" data-k="${esc(key)}"`;

// Ícono cuadrado con la inicial, color estable derivado del nombre (paleta de sistema de Apple); letra oscura en los colores claros para AA.
// Rosa y violeta llevan letra blanca como en la maqueta: el ícono es decorativo (aria-hidden), el nombre va al lado.
const PAL=[["#5e5ce6","#fff"],["#30b0c7","#000"],["#ff375f","#fff"],["#34c759","#000"],["#ff9f0a","#000"],["#bf5af2","#fff"],["#64d2ff","#000"]];
const pico=n=>{let h=0;for(const c of n)h=(h*31+c.codePointAt(0))>>>0;const [bg,ink]=PAL[h%PAL.length],l=(S.alias?.[n]||n.replace(/^_archivo\//,"").split("/").pop()).replace(/[^\p{L}\p{N}]/gu,"").charAt(0).toUpperCase()||"·";
  return `<span class="p-ico" style="background:${bg};color:${ink}" aria-hidden="true">${esc(l)}</span>`};
// Fila de cliente o proyecto: nombre, lo que sigue, dolores si hay.
function pRow(p){
  const n=pickNext(p),pains=p.shared.filter(i=>i.bucket==="pains").length;
  return `<a class="c-row" href="#/proyectos/${encodeURIComponent(p.name)}">${pico(p.name)}<div class="c-main"><b>${esc(alias(p.name))}</b>
    <span class="c-next">${n?`Sigue: ${esc(short(n[1]))}`:"Sin tareas anotadas"}</span></div>
    ${pains?`<span class="c-pain">${pains} ${pains===1?"dolor":"dolores"}</span>`:""}<span class="c-go" aria-hidden="true">›</span></a>`;
}

// Pendiente de cada proyecto (pains → doing → backlog, compartidas y mías) y su prompt listo para pegar.
const BLABEL={pains:"Client pain",doing:"Haciendo",backlog:"Backlog"};
let pend=[];
function pendientes(ps){
  const rank={pains:0,doing:1,backlog:2};
  return ps.map(p=>({p,items:[...p.shared.map(i=>({scope:"shared",i})),...p.mine.map(i=>({scope:"mine",i}))]
      .filter(({i})=>i.bucket in rank).sort((a,b)=>rank[a.i.bucket]-rank[b.i.bucket])}))
    .filter(x=>x.items.length)
    .sort((a,b)=>(isPin(b.p)-isPin(a.p))||(b.items.some(x=>x.i.bucket==="doing")-a.items.some(x=>x.i.bucket==="doing"))||(b.p.day||"").localeCompare(a.p.day||""));
}
function promptOf(p,items){
  const dir=(S.roots.projects||"")+"/"+p.name,line=({scope,i})=>`- ${plain(i.text)}${scope==="mine"?" _(mía)_":""}`;
  const sec=(b,t,max)=>{const l=items.filter(x=>x.i.bucket===b);if(!l.length)return [];
    return [`## ${t}${max&&l.length>max?` (${l.length}) — primeras ${max}`:""}`,...l.slice(0,max||l.length).map(line),""]};
  return [`# ${alias(p.name)} — ${S.today}`,`Repo: \`${dir}\``,"Leé SESSION.md y TASKS.md. Usá dublin-agent.","",
    ...sec("pains","Client pains"),...sec("doing","Haciendo"),...sec("backlog","Backlog",3),
    "Elegí UNA cosa para esta sesión (cliente/deadline → desbloquea → impacto → esfuerzo),",
    "decime cuál y por qué en una línea, y arrancá con un esqueleto que corra.",
    "Si hay que decidir diseño/producto, consultá el cerebro que aplique."].join("\n");
}

function pInicio(){
  const d=new Date(),h=d.getHours(),hola=h<13?"Buen día":h<20?"Buenas tardes":"Buenas noches";
  const clients=byOrder(S.projects.filter(p=>isPin(p)&&!isArch(p)));
  // Proyectos: los no-clientes de la raíz con SESSION.md o TASKS.md, el más reciente primero.
  const propios=S.projects.filter(p=>!isPin(p)&&!isArch(p)&&(p.hasSession||p.hasTasks)&&!p.name.includes("/"));
  const foco=S.foco.map(f=>({f,i:findItem(f.project,f.scope,f.key)}));
  const doneN=foco.filter(x=>x.i?.bucket==="done").length;

  pend=pendientes([...clients,...propios]);
  const c=S.compu,first=c?.history[0],delta=c&&first&&first.day!==S.today?c.disk.free-first.free:null;

    ${c?`<div class="t-sys">
      <div class="sys ${diskP>=90?"bad":diskP>=80?"warn":""}"><div><span>Disco</span><b>${Math.round(c.disk.free)} GB libres</b></div><i><em style="width:${diskP}%"></em></i>
        <small>${diskP}% usado de ${Math.round(c.disk.total)} GB${delta!==null&&Math.abs(delta)>=1?` · ${delta>=0?"+":"−"}${Math.round(Math.abs(delta))} GB desde el ${dm(first.day)}`:""}</small></div>
      <div class="sys ${memP>=95?"bad":memP>=90?"warn":""}"><div><span>Memoria</span><b>${(c.mem.total-c.mem.used).toFixed(1)} GB libres</b></div><i><em style="width:${memP}%"></em></i>
        <small>${memP}% usado de ${Math.round(c.mem.total)} GB</small></div></div>`:""}</header>

  <section class="t-sec"><div class="t-label"><span>Hoy</span><span>${foco.length?`${doneN} de ${foco.length} hechas`:""}</span></div>
    <div class="ins">${foco.map(({f,i})=>{const ok=i?.bucket==="done";return `<div class="t-row${ok?" ok":""}">
      <button class="tick" data-act="fdone" ${dataOf(f.project,f.scope,f.key)} ${i?"":"disabled"} aria-pressed="${ok}" aria-label="${ok?"Reabrir":"Marcar hecha"}">${svg("check")}</button>
      <div class="t-body"><p class="t-txt">${esc(i?short(i):plain(f.key))}</p><p class="t-det"><span class="t-who">${esc(alias(f.project))}</span>${i&&detail(i)?" · "+esc(detail(i)):""}</p></div>
      <button class="t-x" data-act="funfoco" ${dataOf(f.project,f.scope,f.key)} aria-label="Sacar de hoy" title="Sacar de hoy">×</button></div>`}).join("")}</div>

    <form class="t-add" data-form="quick">

      <select name="project" aria-label="Proyecto">${[...clients,...propios].sort((a,b)=>alias(a.name).localeCompare(alias(b.name),"es")).map(p=>`<option value="${esc(p.name)}" ${p.name===(store.get("panel-last-project")||clients[0]?.name)?"selected":""}>${esc(alias(p.name))}</option>`).join("")}</select>
      <input type="hidden" name="where" value="shared:backlog"></form>

      ${items.map(({scope,i})=>`<div class="t-row sug"><div class="t-body"><p class="t-txt">${esc(short(i))}</p><p class="t-det">${BLABEL[i.bucket]}${scope==="mine"?" · mía":""}${detail(i)?" · "+esc(detail(i)):""}</p></div>
        ${inFoco(p.name,scope,i)?`<span class="chip">Hoy</span>`:foco.length>=FOCO_MAX?"":`<button class="t-sum" data-act="foco" ${dataOf(p.name,scope,keyOf(i))}>Sumar a hoy</button>`}</div>`).join("")}
      <details class="pend-md"><summary>Ver prompt</summary><pre>${esc(promptOf(p,items))}</pre></details></div>`).join("")

/* ---------------- Proyectos ---------------- */
// Lista de enfoque, como el Inicio: secciones por estado, una columna, equipo + privadas juntas.
const GUIDE={pains:"Lo que le molesta al cliente: el porqué de todo lo demás.",doing:"Lo de esta semana. Pocas cosas, hasta terminarlas.",backlog:"Lo acordado y listo para agarrar.",ideas:"Para más adelante, sin compromiso.",done:"Lo terminado."};
const KORDER=["pains","doing","backlog","ideas"];
const ago=d=>{if(!d)return"";const n=Math.round((new Date(S.today+"T12:00")-new Date(d+"T12:00"))/864e5);return n<=0?"hoy":n===1?"ayer":n<30?`hace ${n} días`:n<60?"hace un mes":`hace ${Math.round(n/30)} meses`};
// Nombre en la lista: alias o, para carpetas anidadas, "Orago · Api" (sin el "_archivo/" del frente).
const plabel=n=>S.alias?.[n]||n.replace(/^_archivo\//,"").split("/").map(x=>alias(x)).join(" · ");
const curProject=()=>{const {arg}=route();return S.projects.find(p=>p.name===arg)||byOrder(S.projects.filter(p=>isPin(p)&&!isArch(p)))[0]||active()[0]||S.projects[0]};
const phref=(n,sec)=>`#/proyectos/${encodeURIComponent(n)}/${sec}`;

  // La sección sale de la URL; sin sección, la última que usaste (se mantiene al cambiar de proyecto).
  const rs=route().sec;if(PSECS.some(([k])=>k===rs)&&rs!==ui.ptab){ui.ptab=rs;store.set("panel-ptab",rs)}
  if(!PSECS.some(([k])=>k===ui.ptab))ui.ptab="tareas";

  const q=ui.q.trim().toLowerCase(),match=p=>plabel(p.name).toLowerCase().includes(q)||p.name.toLowerCase().includes(q);

  const all=byName(S.projects.filter(p=>!isArch(p)&&!p.name.includes("/")&&(p.hasSession||p.hasTasks||isPin(p)))),arch=byName(S.projects.filter(isArch));
  const row=p=>`<div class="prow" data-name="${esc(p.name)}"><a href="${phref(p.name,ui.ptab)}" title="${esc(plabel(p.name))}" ${p.name===cur.name?'aria-current="true"':""}>${pico(p.name)}<span>${esc(plabel(p.name))}</span><small>${open(p)||""}</small></a></div>`;
  const group=(g,t,l)=>l.length?`<section class="pgroup" data-g="${g}" data-names="${esc(JSON.stringify(l.map(p=>p.name)))}"><h3>${t}</h3>${l.map(row).join("")}</section>`:"";
  const side=q?(group("res","Resultados",byName(S.projects.filter(match)))||`<p class="faint" style="font-size:13px;margin:var(--s3) var(--s2)">Nada con “${esc(ui.q)}”.</p>`)
    :`<section class="pgroup">${all.map(row).join("")}</section>`
      +(arch.length?`<div class="pmore"><button data-act="archp" aria-pressed="${!!ui.archP}"><span>Archivados</span><span>${arch.length}</span></button></div>${ui.archP?`<section class="pgroup">${arch.map(row).join("")}</section>`:""}`:"");
  const opts=(t,l)=>l.length?`<optgroup label="${t}">${l.map(p=>`<option value="${esc(p.name)}" ${p.name===cur.name?"selected":""}>${esc(plabel(p.name))}</option>`).join("")}</optgroup>`:"";

  BOARD=[...cur.shared.map(it=>({...it,scope:"shared"})),...cur.mine.map(it=>({...it,scope:"mine"}))];
  const rows=BOARD.map((it,i)=>({it,i})),of=b=>rows.filter(x=>x.it.bucket===b),cnt=b=>of(b).length;
  const doing=of("doing"),pains=cnt("pains");
  const lead=doing.length?`Seguís con: ${esc(short(doing[0].it))}${doing.length>1?` y ${doing.length-1} más`:""}.`
    :pains?`${pains===1?"Hay un dolor":`Hay ${pains} dolores`} del cliente sin empezar. Arrancá por ahí.`

      </header>
      <nav class="ptabs" aria-label="Secciones del proyecto">${secs}</nav>
      <div class="pbody">${ui.ptab==="tareas"?(RC=null,body):ppTab(cur,ui.ptab)}</div>

}
function kRow(it,i){
  if(ui.editing===i){const first=it.raw.split("\n")[0].replace(/^- \[[ xX]\] /,"");
    return `<div class="task k-row editing" data-i="${i}"><textarea data-edit="${i}" aria-label="Editar tarea">${esc(first)}</textarea>
      <div class="k-edit"><button class="btn primary" data-act="save" data-i="${i}">Guardar</button><button class="btn" data-act="cancel">Cancelar</button><span>Enter guarda · Esc cancela</span></div></div>`}
  const ok=it.bucket==="done",s=short(it),d=detail(it),tags=shape(it.text).tags;
  const raw=it.text.replace(/^(?:\*\*)?(?:\[[^\]]{1,28}\](?:\*\*)?\s*)+/,""),full=plain(raw);

  const who=[...tags,...(it.scope==="mine"?["Privada"]:[])];
  return `<article class="task k-row${ok?" ok":""}" draggable="true" data-i="${i}">
    <button class="tick" data-act="move" data-i="${i}" data-to="${ok?"doing":"done"}" aria-pressed="${ok}" aria-label="${ok?"Reabrir":"Marcar hecha"}">${svg("check")}</button>
    <div class="k-body${can?" can":""}" ${can?`data-act="expand" title="Ver completa"`:""}>
      <p class="t-txt">${esc(s)}</p>${who.length||d?`<p class="t-det">${who.length?`<span class="k-who${tags.length?"":" priv"}">${esc(who.join(" · "))}</span>${d?" · ":""}`:""}${d?esc(d):""}</p>`:""}${can?`<div class="k-full">${esc(full)}</div><span class="k-more">Ver completa</span>`:""}</div>

      <button class="act ${ui.confirm==="t"+i?"sure":""}" data-act="del" data-i="${i}" title="Borrar" aria-label="Borrar">${ui.confirm==="t"+i?"¿Borrar?":svg("trash")}</button>

/* ---------------- Página de proyecto ---------------- */
// Una sola columna: encabezado → código (git) → links → ficha del cliente → historial.
let PJ=null,PJreq="";
async function loadProj(name){
  if(!name)return;PJreq=name;
  try{const r=await fetch("/api/proj?name="+encodeURIComponent(name));const d=await r.json();if(PJreq===name)PJ=r.ok?d:{name,error:d.error}}catch{PJ={name,error:"No pude leer el proyecto"}}
}
const isoDay=iso=>iso?new Date(iso).toLocaleDateString("sv-SE"):"";
const agoT=iso=>ago(isoDay(iso));
const fecha=d=>{const x=new Date(d+"T12:00"),y=x.getFullYear()!==new Date().getFullYear();return x.toLocaleDateString("es-AR",{day:"numeric",month:"short",...(y?{year:"2-digit"}:{})}).replace(".","")};
// Mensaje de commit legible: sin "feat(x):", sin "(#12)", sin backticks.
const cmsg=s=>{let t=String(s).replace(/^Merge pull request #(\d+) from \S+/,"Merge del PR #$1").replace(/^Merge branch '([^']+)'.*$/,"Merge de $1")
  .replace(/^\w+(\([^)]*\))?!?:\s*/,"").replace(/\s*\(#\d+\)\s*$/,"").replace(/`/g,"");t=plain(t);return t.charAt(0).toUpperCase()+t.slice(1)};
// Autor corto: "Ana García" → "Ana"; un usuario tipo "anagarcia2000-dev" → "Anagarcia".
const who=a=>{const t=String(a||"").replace(/[\d_-].*$/,"")||String(a||"");return t.charAt(0).toUpperCase()+t.slice(1)};
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
const ext=(href,label)=>href?`<a class="pp-ic" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(label)}" aria-label="${esc(label)}">${svg("ext")}</a>`:"";

function ppGit(g,name){
  if(!g)return "";
  const gh=g.github,rows=[];
  if(g.hasRemote===false)rows.push(`<div class="pp-warn"><i class="dot"></i><div><b>Este código existe solo en tu compu</b><span>No tiene copia en GitHub ni en otro servidor. Si se rompe el disco, se pierde.</span></div></div>`);
  if(g.branch)rows.push(`<div class="pp-row"><span class="pp-k">Rama</span><span class="pp-v">${esc(g.branch)}</span></div>`);
  if(g.files)rows.push(g.files.length?`<details class="pp-files"><summary><span class="pp-k">Sin commitear</span><span class="pp-v">${plural(g.files.length,"archivo","archivos")}</span></summary>
      <ul>${g.files.slice(0,60).map(f=>`<li>${esc(f)}</li>`).join("")}${g.files.length>60?`<li>… y ${g.files.length-60} más</li>`:""}</ul></details>`
    :`<div class="pp-row"><span class="pp-k">Sin commitear</span><span class="pp-v">Nada, todo guardado</span></div>`);
  if(g.hasRemote){const s=[];if(g.ahead)s.push(`${plural(g.ahead,"commit","commits")} sin subir`);if(g.behind)s.push(`${plural(g.behind,"commit","commits")} para traer`);
    rows.push(`<div class="pp-row" title="Según la última vez que se sincronizó con el remoto"><span class="pp-k">Con el remoto</span><span class="pp-v${g.ahead||g.behind?"":" muted"}">${!g.upstream?"Esta rama no está subida":s.length?s.join(" · "):"Al día"}${g.upstream&&g.behind&&!g.ahead?` · <button class="link" data-act="ppull" ${ui.pPulling?"disabled":""}>${ui.pPulling?"Trayendo…":"Traer cambios"}</button>`:""}</span></div>`);
    rows.push(`<div class="pp-row"><span class="pp-k">Traído de GitHub</span><span class="pp-v muted">${g.fetched?agoT(g.fetched):"nunca"} · <button class="link" data-act="pfetch" ${ui.pFetching?"disabled":""}>${ui.pFetching?"Actualizando…":"Actualizar"}</button></span></div>`)}
  const cs=g.commits||[];
  const commits=cs.length?`<section class="pp-sub"><div class="t-label"><span>Últimos commits</span><span></span></div>
    <div class="ins">${cs.map(c=>`<div class="pp-row pp-c"><div class="t-body"><p class="t-txt">${esc(cmsg(c.msg)||"Sin mensaje")}</p><p class="t-det"><span class="pp-hash">${esc(String(c.hash).slice(0,7))}</span> · ${esc(who(c.author))} · ${agoT(c.date)}</p></div>${gh?ext(`${gh}/commit/${c.hash}`,"Ver en GitHub"):""}</div>`).join("")}
    ${cs.length>=10&&!PJ.noMore?`<button class="pp-more" data-act="pcommits">${ui.pLoading?"Cargando…":"Ver más"}</button>`:""}</div></section>`:"";
  const branches=ppBranches(g);
  const pr=g.pulls;
  const pulls=pr&&pr.length?`<section class="pp-sub"><div class="t-label"><span>PRs abiertos</span><span>${pr.length}</span></div>
    <div class="ins">${pr.map(p=>`<div class="pp-row pp-c"><div class="t-body"><p class="t-txt"><span class="pp-hash">#${p.number}</span> ${esc(cmsg(p.title))}</p><p class="t-det">${esc([p.branch,who(p.author),p.draft?"Borrador":"",agoT(p.updated)].filter(Boolean).join(" · "))}</p></div>${ext(p.url,"Abrir PR")}</div>`).join("")}</div></section>`:"";
  return `${ppRecent(g,name)}<section class="t-sec"><div class="t-label"><span>Código</span>${gh?`<a href="${esc(gh)}" target="_blank" rel="noopener">Abrir en GitHub ↗</a>`:"<span></span>"}</div><div class="ins">${rows.join("")}</div></section>${commits}${branches}${pulls}`;
}

// ---- "Desde tu última visita": por proyecto {prev,last} en localStorage; la visita cuenta si pasaron 30 min ----
let RC=null; // {name,since,first,data,loading}
function visit(name){
  const k="panel-visit-"+name;let v={};try{v=JSON.parse(store.get(k)||"{}")||{}}catch{}
  const now=Date.now();if(!v.last||now-v.last>30*6e4){if(v.last)v.prev=v.last;v.last=now;store.set(k,JSON.stringify(v))}
  return v;
}
async function loadRecent(name,keep){
  if(!keep){const v=visit(name);RC={name,first:!v.prev,since:new Date(v.prev||Date.now()-7*864e5).toISOString(),data:null}}
  RC.loading=true;const rc=RC;
  try{const r=await fetch(`/api/proj/recent?name=${encodeURIComponent(name)}&since=${encodeURIComponent(rc.since)}`);rc.data=r.ok?await r.json():null}catch{rc.data=null}
  rc.loading=false;if(RC===rc)render();
}
// "hace 40 minutos", "hace 3 horas", "ayer", "hace 2 días"
const hace=iso=>{const m=Math.round((Date.now()-Date.parse(iso))/6e4);return m<2?"recién":m<60?`hace ${m} minutos`:m<120?"hace una hora":m<24*60?`hace ${Math.round(m/60)} horas`:agoT(iso)};
const treeUrl=(gh,b)=>`${gh}/tree/${b.split("/").map(encodeURIComponent).join("/")}`;
const ghA=(href,html)=>href?`<a href="${esc(href)}" target="_blank" rel="noopener">${html}</a>`:html;
const andMore=(parts,rest,noun)=>rest>0?`${parts.join(", ")} y ${rest} ${noun}`:parts.length>1?`${parts.slice(0,-1).join(", ")} y ${parts.at(-1)}`:parts.join("");
function ppRecent(g,name){
  if(!RC||RC.name!==name){loadRecent(name);return ""}
  const d=RC.data,gh=g.github,t=Date.parse(RC.since),head=RC.first?"En la última semana":"Desde tu última visita";
  if(!d)return RC.loading?`<section class="t-sec pp-new"><p class="pp-calm">Mirando qué cambió…</p></section>`:"";
  const L=[];
  for(const a of d.authors){
    const ex=a.samples.map(c=>`«${ghA(gh&&`${gh}/commit/${c.hash}`,esc(cmsg(c.msg)||"Sin mensaje"))}»`);
    L.push(`<b>${esc(a.name)}</b> subió ${plural(a.count,"commit","commits")}: ${andMore(ex,a.count-ex.length,"más")}`);
  }
  if(d.more)L.push(`<span class="faint">Hubo más movimiento: se cuentan los últimos ${d.total} commits.</span>`);
  const prs=(g.pulls||[]).filter(p=>p.created&&Date.parse(p.created)>=t);
  for(const p of prs.slice(0,3))L.push(`Se abrió el PR ${ghA(p.url,`#${p.number} «${esc(cmsg(p.title))}»`)}${p.author?` <span class="muted">(${esc(who(p.author))})</span>`:""}`);
  if(prs.length>3)L.push(`Y ${plural(prs.length-3,"PR nuevo más","PRs nuevos más")}`);
  const mv=d.branches.filter(b=>b.name!==g.base&&!["main","master"].includes(b.name));
  if(mv.length)L.push(`${plural(mv.length,"rama con movimiento","ramas con movimiento")}: ${andMore(mv.slice(0,3).map(b=>ghA(gh&&b.remote&&treeUrl(gh,b.name),esc(b.name))),mv.length-3,"más")}`);
  if(!L.length){
    const stale=g.hasRemote&&(!g.fetched||Date.parse(g.fetched)<t)?` Lo último de GitHub se trajo ${g.fetched?hace(g.fetched):"nunca"}.`:"";
    return `<section class="t-sec pp-new"><p class="pp-calm">${RC.first?"Nada nuevo en la última semana.":`Nada nuevo desde tu última visita (${hace(RC.since)}).`}${stale}</p></section>`;
  }
  return `<section class="t-sec pp-new"><div class="t-label"><span>${head}</span><span>${RC.first?"":hace(RC.since)}</span></div>
    <ul class="pp-news">${L.map(l=>`<li>${l}</li>`).join("")}</ul></section>`;
}

// ---- Ramas agrupadas por estado ----
const own=a=>a===0?"sin cambios propios":a===1?"1 cambio propio":`${a} cambios propios`;
// Atraso contra main: 0 al día · ≤10 un poco · ≤100 atrasada · más, muy atrasada.
const lag=(n,base)=>n===0?["al día con "+base,""]:n<=10?["un poco atrasada",""]:n<=100?["atrasada","mid"]:["muy atrasada","far"];
function ppBranches(g){
  const br=g.branches||[],base=g.base,gh=g.github;
  if(!(br.length>1||(br.length===1&&!br[0].current)))return "";
  const prBy=new Map((g.pulls||[]).map(p=>[p.branch,p])),cur=br.find(b=>b.current);
  const rest=br.filter(b=>!b.current&&b.name!==base&&!["main","master"].includes(b.name));
  const max=Math.max(1,...br.filter(b=>!b.merged&&b.name!==base).map(b=>b.behind||0));
  const old=Date.now()-21*864e5;
  const row=b=>{const p=prBy.get(b.name),tags=[],det=[];
    const bar=!b.merged&&base&&b.name!==base&&b.behind!==null;let barH="";
    if(bar){const [txt,cls]=lag(b.behind,base);det.push(own(b.ahead),txt);
      barH=`<span class="pp-bar ${cls}" title="${b.behind?`Le ${b.behind===1?"falta 1 cambio":`faltan ${b.behind} cambios`} de ${esc(base)}`:`Tiene todo lo de ${esc(base)}`}"><i style="width:${b.behind?Math.max(3,Math.round(b.behind/max*100)):0}%"></i></span>`}
    det.push(agoT(b.date));
    if(b.current)tags.push(`<span class="pp-tag">Actual</span>`);
    if(p)tags.push(p.url?`<a class="pp-tag pp-pr" href="${esc(p.url)}" target="_blank" rel="noopener" title="Abrir PR">PR #${p.number}</a>`:`<span class="pp-tag">PR #${p.number}</span>`);
    if(b.remoteOnly)tags.push(`<span class="pp-tag dim">Solo en GitHub</span>`);
    return `<div class="pp-row pp-br${b.merged?" faded":""}"><div class="t-body"><p class="t-txt">${esc(b.name)}</p><p class="t-det">${esc(det.join(" · "))}</p>${barH}</div>
      ${tags.join("")}${gh&&b.pushed?ext(treeUrl(gh,b.name),"Ver en GitHub"):`<span class="pp-ic"></span>`}</div>`};
  const G=[["Con PR abierto",rest.filter(b=>prBy.has(b.name))],
    ["En curso",rest.filter(b=>!prBy.has(b.name)&&!b.merged&&Date.parse(b.date)>=old)],
    ["Viejas",rest.filter(b=>!prBy.has(b.name)&&!b.merged&&Date.parse(b.date)<old),"Candidatas a borrar: más de 3 semanas sin tocar"]];
  const merged=rest.filter(b=>!prBy.has(b.name)&&b.merged);
  const grp=([label,l,sub])=>l.length?`<div class="pp-grp"><div class="t-label"><span>${label}</span><span>${l.length}</span></div>${sub?`<p class="pp-gsub">${sub}</p>`:""}<div class="ins">${l.map(row).join("")}</div></div>`:"";
  return `<section class="pp-sub"><div class="t-label"><span>Ramas</span><span>${br.length}</span></div>
    ${cur?`<div class="ins">${row(cur)}</div>`:""}${G.map(grp).join("")}
    ${merged.length?`<div class="pp-grp"><button class="t-label pp-fold" data-act="pmerged" aria-expanded="${!!ui.pMerged}"><span>Ya mergeadas</span><span>${merged.length} · ${ui.pMerged?"ocultar":"ver"}</span></button>${ui.pMerged?`<div class="ins">${merged.map(row).join("")}</div>`:""}</div>`:""}</section>`;
}

/* ---------------- Calendario ---------------- */
const hm=ms=>new Date(ms).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
const dayKey=ms=>new Date(ms).toLocaleDateString("sv-SE");
function dayLabel(k){const t=new Date();const d=new Date(k+"T12:00");const diff=Math.round((d-new Date(t.toLocaleDateString("sv-SE")+"T12:00"))/864e5);
  const l=d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});return diff===0?"Hoy · "+l:diff===1?"Mañana · "+l:l}
function evRow(e){const now=Date.now(),live=!e.allDay&&e.start<=now&&now<e.end,past=!e.allDay&&e.end<now;
  return `<div class="ev ${live?"live":""} ${past?"past":""}"><span class="when">${e.allDay?"Todo el día":hm(e.start)+"<small>"+hm(e.end)+"</small>"}</span>
    <span class="what"><b>${esc(e.title)}</b>${e.location?`<small>${esc(e.location)}</small>`:""}</span>${CAL.cals.length>1?`<span class="chip">${esc(CAL.cals.find(c=>c.id===e.cal)?.name||"")}</span>`:""}</div>`}
function agendaCard(){

  const t=dayKey(Date.now()),m=dayKey(Date.now()+864e5),ev=CAL.events.filter(e=>dayKey(e.start)===t||(e.allDay&&e.start<=Date.now()&&Date.now()<e.end));
  const next=CAL.events.filter(e=>dayKey(e.start)===m);
  return `<section class="card"><div class="card-head"><h2>Agenda de hoy</h2><a class="link" href="#/calendario">Calendario</a></div>

}

const addDay=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toLocaleDateString("sv-SE")};

const due=d=>!d?"":daysTo(d)<0?"bad":daysTo(d)<=7?"warn":"";
function edad(n){if(!/^\d{4}-\d{2}-\d{2}$/.test(n||""))return "";const m=monthsBetween(n.slice(0,7),S.today.slice(0,7));return m>=12?`${Math.floor(m/12)} ${m<24?"año":"años"}`:`${m} ${m===1?"mes":"meses"}`}

// Las tarjetas y las preguntas salen de los cerebros de `ds cerebro`.
const temaLbl=t=>S.estudio.cerebros.find(c=>c.slug===t)?.title||t;
const delBtn=(key,data)=>`<button class="act ${ui.confirm===key?"sure":""}" data-act="ldel" data-key="${key}" ${data} aria-label="Borrar">${ui.confirm===key?"¿Borrar?":svg("trash")}</button>`;
const ACT={leer:"Leer",ver:"Ver un video",libro:"Leer el libro",curso:"Seguir el curso",practicar:"Practicar",tarjetas:"Repasar tarjetas",examen:"Preguntas de examen"};
// Libros y cursos (libros.md): recorridos por pasos. El próximo paso de un tema sale primero de los obligatorios, en el orden del archivo.
const proxUni=(tema,kind)=>{const L=S.estudio.libros.filter(b=>b.tema===tema&&b.kind===kind),o=[...L.filter(b=>b.obligatoria),...L.filter(b=>!b.obligatoria)];
  for(const b of o){const u=b.unidades.find(u=>!u.hecho);if(u)return{b,u}}return null};
const pdfUrl=(b,u)=>`/api/libro?c=${encodeURIComponent(b.tema)}&f=${encodeURIComponent(b.file)}#page=${u.p0}`;
const uniUrl=(b,u)=>b.kind==="curso"?u.url:pdfUrl(b,u);
const uniPags=u=>u.p1>u.p0?`${u.p1-u.p0+1} páginas`:"1 página";
// Dónde estás: paso i de n del módulo y k de N del recorrido. "Regresión lineal 3 de 8 · Curso 3 de 86 · 10 min".
function pos(b,u){
  const U=b.unidades,G=u.grupo?U.filter(x=>x.grupo===u.grupo):[],k=U.indexOf(u)+1;
  return{i:G.indexOf(u)+1,n:G.length,k,N:U.length,txt:[u.grupo?`${u.grupo} ${G.indexOf(u)+1} de ${G.length}`:"",`${b.kind==="curso"?"Curso":"Libro"} ${k} de ${U.length}`,
    u.min?`${u.min} min`:b.kind==="libro"?uniPags(u):""].filter(Boolean).join(" · ")};
}
// Estado de hoy de una actividad: cuánto llevás, la meta y si está cumplida.
function actHoy(a){
  const E=S.estudio,h=E.hecho.find(x=>x.day===S.today&&x.tipo===a.tipo&&x.tema===a.tema);
  if(a.tipo==="tarjetas"){const n=h?.n||0,meta=a.n||10,quedan=E.cerebros.find(c=>c.slug===a.tema)?.due.length??0;return{n,meta,ok:n>=meta||quedan===0,quedan}}
  if(a.tipo==="examen"){const x=E.examenes.find(x=>x.day===S.today&&x.tema===a.tema),n=x?.n||0,meta=a.n||5;return{n,meta,ok:n>=meta,aciertos:x?.ok||0}}
  if(a.tipo==="libro"||a.tipo==="curso"){const n=E.libros.filter(b=>b.tema===a.tema&&b.kind===a.tipo).reduce((s,b)=>s+b.unidades.filter(u=>u.hecho&&u.day===S.today).length,0),meta=a.n||1;
    return{n,meta,ok:n>=meta||!proxUni(a.tema,a.tipo)}}
  return{ok:!!h};
}
// Lo próximo para leer/ver de un tema: primero las obligatorias, en el orden del archivo.
const proxMat=(tema,tipos)=>{const M=S.estudio.materiales.filter(m=>m.tema===tema&&!m.hecho&&tipos.includes(m.tipo));return M.find(m=>m.obligatoria)||M[0]};

      inner=`<p class="muted" style="margin:0">Elegí la respuesta que te parezca. Llevás ${Math.min(st.n,st.meta)} de ${st.meta}${st.n?`, ${st.aciertos} bien`:""}.</p>${pregunta(c,st.ok?"Seguir":"Otra pregunta",later)}`}
  }else if(a.tipo==="libro"||a.tipo==="curso"){

    else{const p=pos(x.b,x.u),h=x.b.unidades.filter(u=>u.hecho).length,sig=st.n+1<st.meta&&x.b.unidades.some(u=>!u.hecho&&u!==x.u);

      <div class="est-go"><a class="btn big primary" href="${esc(uniUrl(x.b,x.u))}" target="_blank" rel="noopener">${svg("ext")}${cur?"Abrir":"Abrir en la página "+x.u.p0}</a>
        <button class="btn big" data-act="euni" data-line="${x.u.line}" data-raw="${esc(x.u.raw)}">${svg("check")}${sig?"Listo, siguiente":"Listo"}</button>${later}</div>`}
  }else{
    const m=a.tipo==="leer"?proxMat(a.tema,["lectura"]):a.tipo==="ver"?proxMat(a.tema,["video"]):null;
    const ya={leer:"Ya leí por hoy",ver:"Ya lo vi",practicar:"Ya practiqué"}[a.tipo],hint={leer:"Leé un rato y marcalo cuando cortes por hoy.",ver:"Mirá el video y marcalo cuando termines.",practicar:"Practicá un rato y marcalo."}[a.tipo];
    const done=`data-act="ehecho" data-tipo="${a.tipo}" data-tema="${esc(a.tema)}"`;
    inner=`<p class="muted" style="margin:0">${hint}</p>
      ${m?`<p class="est-q">${m.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.titulo)}</a>`:esc(m.titulo)}${m.obligatoria?` <span class="faint" style="font-size:13px">· obligatoria</span>`:""}</p>`
        :a.tipo==="practicar"?"":`<p class="faint" style="margin:var(--s3) 0 0">No quedan ${a.tipo==="leer"?"lecturas":"videos"} pendientes de este tema. Podés sumar en <a href="#/estudio/materiales">Lecturas y videos</a>.</p>`}
      <div class="est-go">${m?.url?`<a class="btn big primary" href="${esc(m.url)}" target="_blank" rel="noopener">${svg("ext")}${a.tipo==="ver"?"Abrir el video":"Abrir la lectura"}</a><button class="btn big" ${done}>${svg("check")}${ya}</button>`
        :`<button class="btn big primary" ${done}>${svg("check")}${ya}</button>`}
        ${m?`<button class="link" data-act="eterm" data-line="${m.line}" data-raw="${esc(m.raw)}" data-tipo="${a.tipo}" data-tema="${esc(a.tema)}" title="Lo marca como visto y cuenta para hoy">Lo terminé entero</button>`:""}${later}</div>`;
  }
  return `<section class="card est-hero${anim?" in":""}" id="est-hero">${top}${inner}</section>`;
}
// Fila de la cola: estado (hecha / ahora / pendiente), qué es, y tocarla la trae a "Ahora".
function colaRow(a,st,now){

  const det=st.ok?"hecho":now?"ahora":["tarjetas","examen"].includes(a.tipo)||st.meta>1?`${Math.min(st.n,st.meta)} de ${st.meta}`:"";
  const lu=(a.tipo==="libro"||a.tipo==="curso")&&!st.ok?proxUni(a.tema,a.tipo):null,lp=lu&&pos(lu.b,lu.u);

// Examen: una pregunta por vez del tema elegido; cada respuesta suma al "aciertos/respondidas" del día.

function pregunta(c,next,extra=""){

    ${q.opts.map((o,j)=>{const cls=r==null?"":o.ok?" ok":j===r?" no":" off";
      return `<button class="btn est-opt${cls}" data-act="exans" data-j="${j}" ${r!=null?"disabled":""}>${r!=null&&o.ok?svg("check"):""}<span>${md(o.text)}</span></button>
        ${r!=null&&(o.ok||j===r)&&o.why?`<p class="muted" style="margin:0 0 var(--s3);font-size:13.5px">${md(o.why)}</p>`:""}`}).join("")}
    ${r==null&&q.hint?`<details><summary class="muted" style="cursor:pointer;font-size:13px;min-height:32px">Pista</summary><p class="muted">${md(q.hint)}</p></details>`:""}
    <div class="est-go">${r!=null?`<button class="btn big primary" data-act="exnext">${next}</button>`:""}${extra}</div>`;
}

const DIAS=[["lun","Lunes"],["mar","Martes"],["mie","Miércoles"],["jue","Jueves"],["vie","Viernes"],["sab","Sábado"],["dom","Domingo"]];

        return `<p class="t-label" style="padding:var(--s2) 0 var(--s1)"><span>${cap(c)}</span></p>`
          +ya.map(x=>`<div class="mov"><span class="t">${esc(x.que)}</span>${delBtn("nd"+x.line,`data-f="nutricion" data-line="${x.line}" data-raw="${esc(x.raw)}"`)}</div>`).join("")
          +(ya.length?"":pl.map(p=>`<div class="mov"><span class="t faint">${esc(p.que)}</span><button class="btn" data-act="ncomi" data-comida="${c}" data-que="${esc(p.que)}">${svg("check")}Comí esto</button></div>`).join(""))}).join("")

      ${pasados.length?`<p class="t-label" style="padding:var(--s4) 0 var(--s1)"><span>Últimos días</span></p>`+pasados.map(d=>`<div class="mov"><span class="d">${dm(d)}</span>
        <span class="t">${N.diario.filter(x=>x.day===d).map(x=>`<span class="faint">${esc(x.comida)}:</span> ${esc(x.que)}`).join(" · ")}</span></div>`).join(""):""}</section>

        :`<p class="muted">Arrancá por una sola comida, por ejemplo el almuerzo de lunes a viernes, y sumá de a poco.</p>`}
      <form class="row" data-form="nplan" style="margin-top:var(--s3)"><select class="field" name="dia" aria-label="Día" style="flex:1 1 110px">${DIAS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select>
        ${sel()}<input class="field" style="flex:3 1 180px" name="que" placeholder="Qué vas a comer" required aria-label="Qué vas a comer"><button class="btn">${svg("plus")}Agregar</button></form></section>

/* ---------------- Flujos ---------------- */
// Qué cerebros consulta el agente, y por qué camino, antes de ciertas tareas. Vive en flujos.md.
// Lienzo de nodos: el disparo a la izquierda, cada cerebro es un nodo y los cables marcan el orden.
// Desde un nodo, los cables sin condición van en paralelo; los que tienen condición son ramas.
const FW=210,FH=62,FIN={x:24,y:40};
const flSlug=n=>String(n).normalize("NFD").replace(/\p{M}/gu,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const cerTitle=slug=>S.estudio.cerebros.find(c=>c.slug===slug)?.title||slug;
const flPos=(f,id)=>id==="inicio"?FIN:f.nodes.find(n=>n.id===id);
function flEdgesSvg(f,edit,tmp){
  const path=(a,b)=>{const x1=a.x+FW,y1=a.y+FH/2,x2=b.x,y2=b.y+FH/2,d=Math.max(40,Math.abs(x2-x1)/2);return `M${x1},${y1} C${x1+d},${y1} ${x2-d},${y2} ${x2},${y2}`};
  const sel=ui.flD?.sel;
  return f.edges.map(e=>{const a=flPos(f,e.from),b=flPos(f,e.to);if(!a||!b)return "";
    const on=edit&&sel?.t==="e"&&sel.k===e.from+">"+e.to;
    return `<path class="fl-wire ${on?"on":""}" d="${path(a,b)}"/>`}).join("")
    +(tmp?`<path class="fl-wire on tmp" d="${path(tmp.a,{x:tmp.x,y:tmp.y-FH/2})}"/>`:"");
}
function flCondsHtml(f,edit){
  return f.edges.map(e=>{const a=flPos(f,e.from),b=flPos(f,e.to);if(!a||!b||!e.cond&&!edit)return "";
    const k=e.from+">"+e.to,on=ui.flD?.sel?.t==="e"&&ui.flD.sel.k===k,x=(a.x+FW+b.x)/2,y=(a.y+b.y)/2+FH/2;
    return e.cond?`<button type="button" class="fl-cond ${on?"on":""}" ${edit?`data-edge="${esc(k)}"`:"tabindex=-1"} style="left:${x}px;top:${y}px">${esc(e.cond)}</button>`
      :`<button type="button" class="fl-dot ${on?"on":""}" data-edge="${esc(k)}" style="left:${x}px;top:${y}px" aria-label="Elegir cable"></button>`}).join("");
}
function flCanvas(f,edit){
  const ns=[{id:"inicio",...FIN},...f.nodes],w=Math.max(...ns.map(n=>n.x))+FW+(edit?300:f.tipo==="ideas"?320:60),h=Math.max(Math.max(...ns.map(n=>n.y))+FH+(edit?200:60),edit?340:0),sel=ui.flD?.sel;
  const trig=(Array.isArray(f.disparo)?f.disparo:String(f.disparo||"").split(",")).map(s=>s.trim()).filter(Boolean),sk=(Array.isArray(f.skills)?f.skills:String(f.skills||"").split(",")).map(s=>s.trim()).filter(Boolean);
  return `<div class="fl-canvas ${edit?"edit":""}" data-keep-scroll="fl-${edit?"edit":esc(f.name)}"><div class="fl-plane" style="width:${w}px;height:${h}px">
    <svg class="fl-wires" width="${w}" height="${h}">${flEdgesSvg(f,edit)}</svg>
    <div class="fl-node start" data-node="inicio" style="left:${FIN.x}px;top:${FIN.y}px"><b>/flujo ${esc(flSlug(f.name||"…"))}</b><small>${esc([...trig,...sk.map(s=>"skill "+s)].join(", ")||"se corre solo con el comando")}</small>${edit?`<span class="fl-port out" data-port="inicio"></span>`:""}</div>
    ${f.nodes.map(n=>`<div class="fl-node ${edit&&sel?.t==="n"&&sel.id===n.id?"on":""} ${n.cerebro?"":"empty"}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px">
      <b>${n.cerebro?esc(cerTitle(n.cerebro)):"Elegí un cerebro"}</b><small>${esc(n.ok===false?"te falta este cerebro":n.pregunta||"sin pregunta")}</small>
      ${edit?`<span class="fl-port in"></span><span class="fl-port out" data-port="${n.id}"></span>`:""}</div>`).join("")}
    ${flCondsHtml(f,edit)}${f.tipo==="ideas"?flBandeja(f):""}</div></div>`;
}
function flInspector(D){
  const s=D.sel,n=s?.t==="n"&&D.nodes.find(x=>x.id===s.id),e=s?.t==="e"&&D.edges.find(x=>x.from+">"+x.to===s.k);
  if(n)return `<div class="fl-insp"><label>Cerebro<select class="field" data-fl="cerebro"><option value="">Elegí un cerebro</option>${S.estudio.cerebros.map(c=>`<option value="${esc(c.slug)}" ${c.slug===n.cerebro?"selected":""}>${esc(c.title)}</option>`).join("")}</select></label>
    <label>Qué le pregunta el agente<input class="field" data-fl="pregunta" value="${esc(n.pregunta)}" placeholder="Ej. ¿qué gancho funciona para este público?"></label>
    <div class="row"><button type="button" class="btn" data-act="flnodo">${svg("plus")}Cerebro a continuación</button><button type="button" class="btn" data-act="flquitar">${svg("trash")}Quitar cerebro</button></div></div>`;
  if(e)return `<div class="fl-insp"><label>Condición para seguir este cable<input class="field" data-fl="cond" value="${esc(e.cond)}" placeholder="Ej. si es para un cliente"></label>
    <p class="faint" style="margin:0">Vacío = se sigue siempre. Si de un cerebro salen varios cables sin condición, el agente los consulta en paralelo.</p>
    <div class="row"><button type="button" class="btn" data-act="flquitar">${svg("trash")}Quitar cable</button></div></div>`;
  return `<div class="fl-insp"><p class="faint" style="margin:0">Tocá un cerebro para editarlo. Para unir dos, arrastrá desde el punto de la derecha de uno hasta el otro. Tocá un cable para ponerle condición.</p>
    <div class="row"><button type="button" class="btn" data-act="flnodo">${svg("plus")}Sumar cerebro</button></div></div>`;
}
function pFlujos(){
  const F=S.flujos,D=ui.flD;
  if(!F.file)return `<div class="head"><div><h1>Flujos</h1><p class="sub">Primero creá un cerebro con <code>ds cerebro new</code>.</p></div></div>`;
  const editor=D?`<section class="card"><div class="fl-top">
      <input class="field" data-fl="name" value="${esc(D.name)}" placeholder="Nombre del flujo, ej. Ad para cliente" aria-label="Nombre del flujo">
      <select class="field" data-fl="tipo" aria-label="Qué produce"><option value="consulta" ${D.tipo!=="ideas"?"selected":""}>Consulta: el agente aprende y hace el trabajo</option><option value="ideas" ${D.tipo==="ideas"?"selected":""}>Ideas: el agente deja ideas en la bandeja</option></select>
      <input class="field" data-fl="disparo" value="${esc(D.disparo)}" placeholder="Sugerirlo si el pedido dice… (ad, campaña)" aria-label="Palabras para sugerirlo">
      ${D.tipo==="ideas"?`<input class="field" data-fl="angulos" value="${esc(D.angulos)}" placeholder="Ángulos de venta (dolor, prueba social…)" aria-label="Ángulos de venta">`:""}
      <input class="field" data-fl="skills" list="fl-skills" value="${esc(D.skills)}" placeholder="Correrlo si el agente usa la skill (solo consulta)" aria-label="Skills que lo activan"></div>
    ${flCanvas(D,true)}${flInspector(D)}
    <div class="row" style="margin-top:var(--s4)"><button class="btn primary" data-act="flsave">${svg("check")}Guardar</button><button class="btn" data-act="flcancel">Cancelar</button>
      ${D.old?`<button class="btn" data-act="fldel" style="margin-left:auto">${ui.confirm==="fldel"?"¿Borrar el flujo?":svg("trash")+"Borrar flujo"}</button>`:""}</div></section>`:"";
  return `<div class="head"><div><h1>Flujos</h1><p class="sub">Qué cerebros consulta el agente, y por qué camino, antes de ciertas tareas. Vive en <code>${esc(F.file)}</code>.</p></div>
    ${D?"":`<div class="row"><button class="btn" data-act="flimp">Importar</button><button class="btn primary" data-act="flnew">${svg("plus")}Nuevo flujo</button></div>`}</div>
  ${ui.flNote?`<section class="card" style="margin-bottom:var(--s4)"><div class="card-head"><p style="margin:0">${ui.flNote}</p><button class="btn" data-act="flnote">Listo</button></div></section>`:""}
  ${ui.flImp&&!D?`<section class="card" style="margin-bottom:var(--s4)"><div class="card-head"><h2>Importar un flujo</h2></div>
    <p class="muted" style="margin:0 0 var(--s3)">Pegá el texto que te pasaron. Si trae cerebros que no tenés, los creo apuntando a su notebook: pedile al dueño que te dé acceso y corré <code>ds cerebro sync</code>.</p>
    <textarea class="field fl-paste" data-fl="imp" placeholder="## Nombre del flujo…" aria-label="Texto del flujo">${esc(ui.flImpText||"")}</textarea>
    <div class="row" style="margin-top:var(--s3)"><button class="btn primary" data-act="flimpok">Importar</button><button class="btn" data-act="flimp">Cancelar</button></div></section>`:""}
  <datalist id="fl-skills">${F.skills.map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
  <div style="display:grid;gap:var(--s4)">${D&&!D.old?editor:""}
    ${F.list.map((f,i)=>D?.old===f.raw?editor:`<section class="card"><div class="card-head"><h2>${esc(f.name)} <span class="faint fl-tipo">${f.tipo==="ideas"?"Ideas → bandeja":"Consulta"}</span></h2><div class="row"><button class="btn" data-act="flshare" data-i="${i}" aria-expanded="${ui.flShare===i}">Compartir</button><button class="btn" data-act="fledit" data-i="${i}">${svg("edit")}Editar</button></div></div>${ui.flShare===i?flSharePanel(f,i):""}${flCanvas(f,false)}</section>`).join("")}
    ${!F.list.length&&!D?`<section class="card"><p class="muted" style="margin:0">Un flujo es una receta: “para un ad, el agente consulta primero Marca personal; si es para un cliente sigue con Dirección creativa, si no con Storytelling”. Así cada tarea pasa siempre por los mismos cerebros.</p></section>`:""}
  </div>`;
}
// Compartir = texto del flujo + qué notebook es cada cerebro, para que el otro lo importe.
const flCers=f=>[...new Set(f.nodes.map(n=>n.cerebro))];
const flText=f=>["<!-- Flujo de ds panel: pegalo en Flujos → Importar -->",f.raw,...flCers(f).map(c=>`<!-- cerebro ${c} | ${S.flujos.cer[c]?.title||c} | ${S.flujos.cer[c]?.notebook||""} -->`)].join("\n");
function flSharePanel(f,i){
  return `<div class="fl-share"><p class="muted" style="margin:0">Le pasás el texto y lo importa en su panel. Para que el agente pueda consultarlos, también necesita acceso a estos cerebros: ${flCers(f).map(c=>esc(cerTitle(c))).join(", ")}.</p>
    <form class="row" data-form="flshare" data-i="${i}"><input class="field grow" name="email" type="email" placeholder="Su mail de Google" required aria-label="Mail"><button class="btn" ${ui.flSharing?"disabled":""}>${ui.flSharing?"Compartiendo…":"Darle acceso a los cerebros"}</button></form>
    <div class="row"><button class="btn primary" data-act="flcopy" data-i="${i}">Copiar flujo</button></div></div>`;
}
// Flujo de ideas: termina en la Bandeja de Contenido. No es un nodo guardado: los cerebros
// donde termina el camino (sin cables de salida) desembocan ahí.
function flBandeja(f){
  const x=Math.max(FIN.x,...f.nodes.map(n=>n.x))+FW+90,ends=f.nodes.filter(n=>!f.edges.some(e=>e.from===n.id)),y=ends.length?Math.round(ends.reduce((a,n)=>a+n.y,0)/ends.length):FIN.y;
  const w=ends.map(n=>{const x1=n.x+FW,y1=n.y+FH/2,y2=y+FH/2,d=Math.max(40,(x-x1)/2);return `<path class="fl-wire end" d="M${x1},${y1} C${x1+d},${y1} ${x-d},${y2} ${x},${y2}"/>`}).join("");
  return `<svg class="fl-wires" width="${x+FW}" height="${y+FH+40}" style="width:${x+FW}px;height:${y+FH+40}px">${w}</svg>
    <a class="fl-node sink" href="#/contenido" style="left:${x}px;top:${y}px"><b>Bandeja de contenido</b><small>${(f.angulos??ANGULOS.split(", ")).length?`${(f.angulos??ANGULOS.split(", ")).length} ángulos de venta · vos elegís`:"Las ideas esperan tu sí o no"}</small></a>`;
}
const ANGULOS="dolor, resultado, prueba social, objeción, comparación, oferta";   // mismos de ds flujo
const flId=D=>{let k=D.nodes.length;while(D.nodes.some(n=>n.id==="n"+k))k++;return "n"+k};
function flAddNode(D){
  const from=D.sel?.t==="n"?D.nodes.find(n=>n.id===D.sel.id):null,src=from||(D.nodes.length?null:{id:"inicio",...FIN});
  const base=src||{x:Math.max(...D.nodes.map(n=>n.x)),y:0},x=base.x+FW+90;let y=src?src.y:FIN.y;
  while(D.nodes.some(n=>Math.abs(n.x-x)<FW&&Math.abs(n.y-y)<FH+10))y+=FH+30;
  const n={id:flId(D),cerebro:"",pregunta:"",x,y};D.nodes.push(n);if(src)D.edges.push({from:src.id,to:n.id,cond:""});D.sel={t:"n",id:n.id};
}
// Arrastre: mover nodos y tirar cables. El borrador vive en ui.flD, así un render no pierde nada.
let flDrag=null;
function flRedraw(tmp){const c=document.querySelector(".fl-canvas.edit");if(!c||!ui.flD)return;c.querySelector(".fl-wires").innerHTML=flEdgesSvg(ui.flD,true,tmp);
  c.querySelectorAll(".fl-cond,.fl-dot").forEach(x=>x.remove());c.querySelector(".fl-plane").insertAdjacentHTML("beforeend",flCondsHtml(ui.flD,true))}
document.addEventListener("pointerdown",e=>{
  const c=e.target.closest?.(".fl-canvas.edit");if(!c||!ui.flD)return;const D=ui.flD,r=c.querySelector(".fl-plane").getBoundingClientRect();
  const port=e.target.closest(".fl-port.out"),node=e.target.closest(".fl-node"),edge=e.target.closest("[data-edge]");
  if(port){e.preventDefault();flDrag={t:"wire",from:port.dataset.port,r}}
  else if(edge){D.sel={t:"e",k:edge.dataset.edge};render()}
  else if(node&&node.dataset.node!=="inicio"){const n=D.nodes.find(x=>x.id===node.dataset.node);flDrag={t:"move",n,el:node,dx:e.clientX-r.left-n.x,dy:e.clientY-r.top-n.y,x0:e.clientX,y0:e.clientY,r};node.setPointerCapture?.(e.pointerId)}
  else if(!node){D.sel=null;render()}
});
document.addEventListener("pointermove",e=>{
  if(!flDrag)return;const {r}=flDrag;
  if(flDrag.t==="move"){const n=flDrag.n;n.x=Math.max(FIN.x+FW+40,Math.round(e.clientX-r.left-flDrag.dx));n.y=Math.max(0,Math.round(e.clientY-r.top-flDrag.dy));
    flDrag.el.style.left=n.x+"px";flDrag.el.style.top=n.y+"px";flRedraw()}
  else flRedraw({a:flPos(ui.flD,flDrag.from),x:e.clientX-r.left,y:e.clientY-r.top});
});
document.addEventListener("pointerup",e=>{
  if(!flDrag)return;const d=flDrag,D=ui.flD;flDrag=null;
  if(d.t==="move"){if(Math.abs(e.clientX-d.x0)<4&&Math.abs(e.clientY-d.y0)<4)D.sel={t:"n",id:d.n.id};render();return}
  const to=document.elementFromPoint(e.clientX,e.clientY)?.closest(".fl-node")?.dataset.node;
  if(to&&to!=="inicio"&&to!==d.from&&!D.edges.some(x=>x.from===d.from&&x.to===to)){D.edges.push({from:d.from,to,cond:""});D.sel={t:"e",k:d.from+">"+to}}
  render();
});
document.addEventListener("input",e=>{
  const k=e.target.dataset?.fl,D=ui.flD;if(k==="imp"){ui.flImpText=e.target.value;return}if(!k||!D)return;
  if(k==="name"||k==="disparo"||k==="skills"||k==="angulos"){D[k]=e.target.value;return}
  if(k==="tipo"){D.tipo=e.target.value;if(D.tipo==="ideas"&&!D.angulos)D.angulos=ANGULOS;render();return}
  const n=D.sel?.t==="n"&&D.nodes.find(x=>x.id===D.sel.id),ed=D.sel?.t==="e"&&D.edges.find(x=>x.from+">"+x.to===D.sel.k);
  if(k==="pregunta"&&n){n.pregunta=e.target.value;const s=document.querySelector(`.fl-node[data-node="${n.id}"] small`);if(s)s.textContent=n.pregunta||"sin pregunta"}
  if(k==="cerebro"&&n){n.cerebro=e.target.value;render()}
  if(k==="cond"&&ed){ed.cond=e.target.value;flRedraw()}
});
document.addEventListener("keydown",e=>{
  if(!ui.flD?.sel||!["Delete","Backspace"].includes(e.key)||e.target.closest?.("input,select,textarea"))return;
  e.preventDefault();flRemove(ui.flD);render();
});
function flRemove(D){const s=D.sel;if(!s)return;
  if(s.t==="n"){D.nodes=D.nodes.filter(n=>n.id!==s.id);D.edges=D.edges.filter(x=>x.from!==s.id&&x.to!==s.id)}else D.edges=D.edges.filter(x=>x.from+">"+x.to!==s.k);D.sel=null}
async function flAct(act,b){
  const F=S.flujos;
  if(act==="flnew"){ui.flD={old:"",name:"",tipo:"consulta",angulos:"",disparo:"",skills:"",nodes:[],edges:[],sel:null};flAddNode(ui.flD);render()}
  else if(act==="fledit"){const f=F.list[Number(b.dataset.i)];ui.flD={old:f.raw,name:f.name,tipo:f.tipo,angulos:(f.angulos??ANGULOS.split(", ")).join(", "),disparo:f.disparo.join(", "),skills:f.skills.join(", "),nodes:f.nodes.map(n=>({...n})),edges:f.edges.map(x=>({...x})),sel:null};render()}
  else if(act==="flcancel"){ui.flD=null;render()}
  else if(act==="flnodo"){flAddNode(ui.flD);render();document.querySelector(`.fl-canvas.edit .fl-node[data-node="${ui.flD.sel.id}"]`)?.scrollIntoView({block:"nearest",inline:"nearest"});document.querySelector('[data-fl="cerebro"]')?.focus({preventScroll:true})}
  else if(act==="flquitar"){flRemove(ui.flD);render()}
  else if(act==="flsave"){const D=ui.flD;try{await post("/api/flujos",{op:"save",old:D.old,name:D.name,tipo:D.tipo,angulos:D.angulos,disparo:D.disparo,skills:D.skills,nodes:D.nodes,edges:D.edges});ui.flD=null;render();toast("Flujo guardado")}catch{}}
  else if(act==="flimp"){ui.flImp=!ui.flImp;ui.flImpText="";render();document.querySelector('[data-fl="imp"]')?.focus()}
  else if(act==="flnote"){ui.flNote="";render()}
  else if(act==="flshare"){const i=Number(b.dataset.i);ui.flShare=ui.flShare===i?null:i;render()}
  else if(act==="flcopy"){navigator.clipboard.writeText(flText(F.list[Number(b.dataset.i)])).then(()=>toast("Flujo copiado: pasáselo por donde quieras")).catch(()=>toast("No pude copiar"))}
  else if(act==="flimpok"){try{const r=await post("/api/flujos",{op:"import",text:ui.flImpText||""});ui.flImp=false;ui.flImpText="";
    ui.flNote=`Importé «${esc(r.name)}».`+(r.created.length?` Creé ${r.created.length===1?"el cerebro":"los cerebros"} ${esc(r.created.join(", "))}: ya estoy trayendo sus fuentes de NotebookLM (tarda unos minutos). Si todavía no te dieron acceso, pedilo y corré <code>ds cerebro sync</code>.`:"");render()}catch{}}
  else if(act==="fldel"){const D=ui.flD;confirmOr("fldel",()=>post("/api/flujos",{op:"delete",old:D.old}).then(()=>{ui.flD=null;render();toast("Flujo borrado")}).catch(()=>{}))}
}

/* ---------------- Contenido ---------------- */
// contenido.md: las ideas que dejan los flujos de tipo ideas (ds contenido add). Vos elegís:
// sí → Cola, no → Descartadas; después Producción → Publicado.
function ideaRow(x,sec,acts){
  return `<div class="idea"><div class="idea-t"><span class="faint">${x.angulo?`<span class="idea-ang">${esc(cap(x.angulo))}</span> · `:""}${esc(alias(x.proyecto))}${x.flujo?" · "+esc(x.flujo):""}</span><b>${esc(x.idea)}</b>${x.gancho?`<span class="muted">${esc(x.gancho)}</span>`:""}</div>
    <div class="idea-a">${acts.map(([lbl,op,to,cls])=>`<button class="btn ${cls||""}" data-act="cmove" data-op="${op}" data-to="${to||""}" data-line="${x.line}" data-raw="${esc(x.raw)}">${lbl}</button>`).join("")}</div></div>`;
}
function pContenido(){
  const C=S.contenido,X=C.secs,proys=[...new Set(S.projects.map(p=>p.name))];
  const card=(t,sub,body,empty)=>`<section class="card"><div class="card-head"><h2>${t}</h2>${sub?`<span class="faint">${sub}</span>`:""}</div>${body||`<p class="muted" style="margin:0">${empty}</p>`}</section>`;
  return `<div class="head"><div><h1>Contenido</h1><p class="sub">Las ideas que te dejan los flujos de tipo ideas. Decís sí o no y lo que aprobás pasa a la cola. Vive en <code>${esc(C.file)}</code>.</p></div></div>
  <div style="display:grid;gap:var(--s4);max-width:820px">
    ${card("Bandeja",X.Bandeja.length?X.Bandeja.length+" por decidir":"",X.Bandeja.map(x=>ideaRow(x,"Bandeja",[["Sí","move","Cola","primary"],["No","move","Descartadas"]])).join(""),
      `Vacía. Pedile al agente, por ejemplo, “ideas de contenido para ${esc(alias(proys[0]||"rumen"))}”, o anotá una abajo.`)}
    ${card("Cola","",X.Cola.map(x=>ideaRow(x,"Cola",[["↑","up"],["↓","down"],["Empezar","move","Producción","primary"],["Quitar","move","Descartadas"]])).join(""),"Lo que aprobás queda acá, en el orden en que lo vas a hacer.")}
    ${X["Producción"].length?card("En producción","",X["Producción"].map(x=>ideaRow(x,"Producción",[["Publicado","move","Publicado","primary"],["A la cola","move","Cola"]])).join("")):""}
    ${X.Publicado.length?card("Publicado",X.Publicado.length+"",X.Publicado.slice(-10).reverse().map(x=>ideaRow(x,"Publicado",[])).join("")):""}
    ${X.Descartadas.length?`<details class="card idea-desc"><summary>Descartadas · ${X.Descartadas.length} <span class="faint">(el agente no las vuelve a proponer)</span></summary>${X.Descartadas.map(x=>ideaRow(x,"Descartadas",[["Recuperar","move","Bandeja"],["Borrar","delete"]])).join("")}</details>`:""}
    <section class="card"><div class="card-head"><h2>Anotar una idea</h2></div>
      <form class="row" data-form="cidea"><select class="field" name="proyecto" aria-label="Proyecto" style="flex:1 1 140px">${proys.map(n=>`<option value="${esc(n)}">${esc(alias(n))}</option>`).join("")}</select>
        <input class="field" style="flex:3 1 200px" name="idea" placeholder="La idea" required aria-label="La idea"><input class="field" style="flex:2 1 160px" name="gancho" placeholder="Gancho (opcional)" aria-label="Gancho">

  </div>`;
