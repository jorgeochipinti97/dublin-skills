/* ---------------- Finanzas ---------------- */
const compact=n=>new Intl.NumberFormat("es-AR",{notation:"compact",maximumFractionDigits:1}).format(n);
const ymLabel=m=>new Date(m+"-15").toLocaleDateString("es-AR",{month:"short",year:"2-digit"});
const monthsBetween=(a,b)=>{const [y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return (y2-y1)*12+(m2-m1)};
const addMonths=(m,n)=>{const [y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+n,1);return d.toLocaleDateString("sv-SE").slice(0,7)};
const calc=()=>{try{return JSON.parse(store.get("panel-calc"))||null}catch{return null}};
function avgSaving(){const h=S.finanzas.history.slice(-3);return h.length?h.reduce((s,x)=>s+x.net,0)/h.length:0}
function meter(pct,state){return `<span class="meter ${state||""}"><em style="width:${Math.min(100,Math.max(0,pct))}%"></em></span>`}

function pFinanzas(){
  const tabs=[["resumen","Resumen"],["facturas","Facturas"],["inversiones","Inversiones"],["objetivos","Objetivos"],["proyeccion","Proyección"],["interes","Interés compuesto"]];
  const want=route().arg||ui.finTab,t=tabs.some(x=>x[0]===want)?want:"resumen";ui.finTab=t;store.set("panel-fintab",t);
  const label=m=>new Date(m+"-15").toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  const F=S.finanzas;
  return `<div class="head"><div><h1>Finanzas</h1><p class="sub">Todo vive en <code>${esc(F.file)}</code>: movimientos, objetivos y presupuestos. Lo podés editar a mano.</p></div>
    ${t==="resumen"?`<select class="field" data-input="month" aria-label="Mes">${F.months.map(m=>`<option value="${m}" ${m===F.month?"selected":""}>${label(m)}</option>`).join("")}</select>`:""}</div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-act="fintab" data-v="${k}" aria-selected="${k===t}">${l}</button>`).join("")}</div>
  ${({resumen:finResumen,facturas:finFacturas,inversiones:finInversiones,objetivos:finObjetivos,proyeccion:finProyeccion,interes:finInteres})[t]()}`;
}

// Categorías estándar para el autocompletado (las que ya usaste aparecen primero).
const CATS=["super","comida","delivery","alquiler","expensas","servicios","internet","celular","transporte","nafta","auto","salud","prepaga","educacion","suscripciones","software","ropa","hogar","salidas","viajes","regalos","mascotas","impuestos","monotributo","tarjeta","sueldo","facturas","inversiones","otros"];
function finResumen(){
  const F=S.finanzas,mv=F.movs,ing=mv.filter(m=>m.amount>0).reduce((s,m)=>s+m.amount,0),gas=-mv.filter(m=>m.amount<0).reduce((s,m)=>s+m.amount,0);
  const cats={};mv.filter(m=>m.amount<0).forEach(m=>cats[m.cat]=(cats[m.cat]||0)-m.amount);
  F.budgets.forEach(b=>{if(!(b.cat in cats))cats[b.cat]=0});
  const ck=Object.entries(cats).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...ck.map(([c,v])=>Math.max(v,F.budgets.find(b=>b.cat===c)?.amount||0)));
  const catRow=([c,v],i)=>{const b=F.budgets.find(x=>x.cat===c);
    if(!b)return `<div class="bar"><div><span>${esc(c)}</span><span class="muted">${ars(v)}</span></div>${meter(v/max*100)}</div>`;
    const pct=v/b.amount*100,st=pct>100?"bad":pct>=80?"warn":"";
    return `<div class="bar"><div><span>${esc(c)} <button class="act tiny" data-act="bdel" data-i="${F.budgets.indexOf(b)}" title="Quitar presupuesto" aria-label="Quitar presupuesto">${svg("trash")}</button></span>
      <span class="muted">${ars(v)} <span class="faint">/ ${ars(b.amount)}</span></span></div>${meter(pct,st)}
      ${pct>100?`<p class="state bad">Te pasaste ${ars(v-b.amount)}</p>`:pct>=80?`<p class="state warn">Usaste el ${Math.round(pct)}%</p>`:""}</div>`};
  return `<div class="stats"><div class="stat"><span>Ingresos</span><b class="pos">${ars(ing)}</b></div><div class="stat"><span>Gastos</span><b class="neg">${ars(gas)}</b></div><div class="stat"><span>Saldo del mes</span><b class="${ing-gas<0?"neg":""}">${ars(ing-gas)}</b></div></div>
  <section class="card"><form class="form-fin" data-form="fin">
    <div class="seg" role="group" aria-label="Tipo"><button type="button" data-act="tipo" data-v="-" aria-pressed="${(ui.tipo||"-")==="-"}">Gasto</button><button type="button" data-act="tipo" data-v="+" aria-pressed="${ui.tipo==="+"}">Ingreso</button></div>
    <input class="field" name="monto" inputmode="decimal" placeholder="Monto" required aria-label="Monto">
    <input class="field wide" name="desc" placeholder="Descripción" required aria-label="Descripción">
    <input class="field" name="cat" placeholder="Categoría" list="cats" aria-label="Categoría"><datalist id="cats">${[...new Set([...mv.map(m=>m.cat),...F.budgets.map(b=>b.cat),...CATS])].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <button class="btn primary">${svg("plus")}Anotar</button></form></section>
  <div class="fin">
    <section class="card"><div class="card-head"><h2>Gastos por categoría</h2></div>
      ${ck.length?ck.map(catRow).join(""):`<p class="muted">Sin gastos este mes.</p>`}
      <form class="row" data-form="budget" style="margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--line)">
        <input class="field" style="flex:1 1 120px" name="cat" placeholder="Categoría" list="cats" required aria-label="Categoría del presupuesto">
        <input class="field" style="flex:1 1 110px" name="amount" inputmode="decimal" placeholder="Tope mensual" required aria-label="Tope mensual"><button class="btn">Presupuesto</button></form></section>
    <section class="card"><div class="card-head"><h2>Movimientos</h2><span class="faint" style="font-size:12.5px">${mv.length}</span></div>
      ${mv.length?mv.map((m,i)=>`<div class="mov"><span class="d">${m.day.slice(8)}/${m.day.slice(5,7)}</span><span class="t">${esc(m.desc)} <span class="chip">${esc(m.cat)}</span></span><span class="a ${m.amount<0?"neg":"pos"}">${ars(m.amount)}</span>
        <button class="act ${ui.confirm==="f"+i?"sure":""}" data-act="fdel" data-i="${i}" aria-label="Borrar">${ui.confirm==="f"+i?"¿Borrar?":svg("trash")}</button></div>`).join(""):`<p class="muted">Sin movimientos este mes.</p>`}</section>
  </div>`;
}

function finFacturas(){
  const X=S.facturas,pend=X.filter(f=>!f.pagada),cob=X.filter(f=>f.pagada&&f.pagada.slice(0,7)===S.today.slice(0,7));
  const sum=a=>a.reduce((s,f)=>s+f.monto,0),dm=d=>d?`${d.slice(8)}/${d.slice(5,7)}`:"";
  const row=f=>{const i=X.indexOf(f),late=!f.pagada&&f.vto&&f.vto<S.today;
    return `<div class="mov fac"><span class="d">${dm(f.day)}</span>
      <span class="t"><b>${f.letra} ${esc(f.id)}</b> · ${esc(f.cliente)}<small>${esc(f.desc)} · ${esc(f.periodo)}${f.pagada?` · cobrada ${dm(f.pagada)}`:f.vto?` · vence ${dm(f.vto)}`:""}</small></span>
      ${f.pagada?`<span class="chip">Pagada</span>`:`<span class="chip ${late?"late":""}">${late?"Vencida":"Pendiente"}</span>`}
      <span class="a ${f.pagada?"pos":""}">${ars(f.monto)}</span>
      <button class="btn" data-act="fpdf" data-i="${i}">PDF</button>
      ${f.pagada?"":`<button class="btn primary" data-act="fpagar" data-i="${i}">${ui.confirm==="p"+i?"¿Confirmar?":"Marcar pagada"}</button>`}</div>`};
  return `<div class="stats"><div class="stat"><span>Por cobrar</span><b>${ars(sum(pend))}</b></div><div class="stat"><span>Cobrado este mes</span><b class="pos">${ars(sum(cob))}</b></div><div class="stat"><span>Facturas</span><b>${X.length}</b></div></div>
  <section class="card"><div class="card-head"><h2>Pendientes</h2><span class="faint" style="font-size:12.5px">${pend.length}</span></div>
    ${pend.length?pend.map(row).join(""):`<p class="muted">Nada por cobrar.</p>`}</section>
  <section class="card" style="margin-top:var(--s4)"><div class="card-head"><h2>Pagadas</h2><span class="faint" style="font-size:12.5px">${X.length-pend.length}</span></div>
    ${X.length-pend.length?X.filter(f=>f.pagada).map(row).join(""):`<p class="muted">Todavía ninguna.</p>`}</section>
  <p class="muted" style="font-size:13px;margin-top:var(--s4)">Para emitir: <code>ds factura emitir &lt;cuit&gt; &lt;monto&gt; "&lt;descripción&gt;" --periodo AAAA-MM</code></p>`;
}

function finInversiones(){
  const V=S.finanzas.inversiones,fmt=(n,m)=>m==="USD"?"US$ "+n.toLocaleString("es-AR",{maximumFractionDigits:0}):ars(n);
  const tot=m=>{const l=V.filter(v=>v.moneda===m),i=l.reduce((s,v)=>s+v.invertido,0),a=l.reduce((s,v)=>s+v.actual,0);return {n:l.length,i,a}};
  const pct=(a,i)=>i?((a-i)/i*100):0,sg=x=>x>=0?"+":"−";
  const stat=m=>{const t=tot(m);if(!t.n)return "";const g=t.a-t.i;
    return `<div class="stat"><span>Valor actual ${m}</span><b>${fmt(t.a,m)}</b><small class="${g<0?"neg":"pos"}">${sg(g)}${fmt(Math.abs(g),m)} · ${sg(g)}${Math.abs(pct(t.a,t.i)).toFixed(1)}%</small></div>`};
  const tipos={};V.forEach(v=>{const k=v.tipo+" · "+v.moneda;tipos[k]=(tipos[k]||0)+v.actual});
  return `${V.length?`<div class="stats">${stat("ARS")}${stat("USD")}</div>`:""}
  <section class="card"><form class="row" data-form="inv">
    <input class="field" style="flex:2 1 160px" name="name" placeholder="Nombre (ej. Plazo fijo Galicia)" required aria-label="Nombre">
    <input class="field" style="flex:1 1 130px" name="tipo" placeholder="Tipo" list="invtipos" aria-label="Tipo"><datalist id="invtipos">${["plazo fijo","fci","dólares","cedears","acciones","bonos","cripto","caución","otros"].map(t=>`<option value="${t}">`).join("")}</datalist>
    <input class="field" style="flex:1 1 110px" name="invertido" inputmode="decimal" placeholder="Invertido" required aria-label="Monto invertido">
    <input class="field" style="flex:1 1 110px" name="actual" inputmode="decimal" placeholder="Valor actual" aria-label="Valor actual">
    <select class="field" style="flex:0 1 90px" name="moneda" aria-label="Moneda"><option>ARS</option><option>USD</option></select>
    <input class="field" style="flex:1 1 140px" name="vence" type="date" aria-label="Vence (opcional)" title="Vence (opcional)">
    <button class="btn primary">${svg("plus")}Agregar</button></form></section>
  ${V.length?`<div class="fin">
    <section class="card"><div class="card-head"><h2>Por tipo</h2></div>
      ${["ARS","USD"].map(m=>{const ks=Object.entries(tipos).filter(([k])=>k.endsWith(m)).sort((a,b)=>b[1]-a[1]),t=tot(m).a;
        return ks.map(([k,v])=>`<div class="bar"><div><span>${esc(k)}</span><span class="muted">${fmt(v,m)} <span class="faint">· ${Math.round(v/t*100)}%</span></span></div>${meter(v/t*100)}</div>`).join("")}).join("")}</section>
    <section class="card"><div class="card-head"><h2>Posiciones</h2><span class="faint" style="font-size:12.5px">${V.length}</span></div>
      ${V.map((v,i)=>{const g=v.actual-v.invertido;return `<div class="mov fac"><span class="t"><b>${esc(v.name)}</b><small>${esc(v.tipo)} · invertido ${fmt(v.invertido,v.moneda)}${v.vence?` · vence ${dm(v.vence)} (${when(v.vence)})`:""}</small></span>
        <span class="a">${fmt(v.actual,v.moneda)}<small class="${g<0?"neg":"pos"}" style="display:block;font-size:12px;text-align:right">${sg(g)}${Math.abs(pct(v.actual,v.invertido)).toFixed(1)}%</small></span>
        <form class="row" data-form="invact" data-i="${i}" style="flex-wrap:nowrap"><input class="field" style="width:110px" name="actual" inputmode="decimal" placeholder="Nuevo valor" required aria-label="Nuevo valor actual"><button class="btn">Actualizar</button></form>
        <button class="act ${ui.confirm==="v"+i?"sure":""}" data-act="vdel" data-i="${i}" aria-label="Borrar">${ui.confirm==="v"+i?"¿Borrar?":svg("trash")}</button></div>`}).join("")}</section></div>`
    :`<p class="empty">Cargá lo que tenés invertido: plazo fijo, FCI, dólares, CEDEARs… Actualizás el valor cuando quieras y ves cuánto ganás.</p>`}`;
}

function finObjetivos(){
  const G=S.finanzas.goals,now=S.today.slice(0,7),avg=avgSaving();
  const cardG=(g,i)=>{const pct=g.ahorrado/g.meta*100,falta=Math.max(0,g.meta-g.ahorrado),left=g.para?monthsBetween(now,g.para):null;
    const need=left&&left>0?falta/left:null,eta=avg>0&&falta>0?Math.ceil(falta/avg):null;
    return `<article class="card goal"><div class="card-head" style="margin-bottom:var(--s2)"><h2>${esc(g.name)}</h2>${g.para?`<span class="chip">${ymLabel(g.para)}</span>`:""}</div>
      <p class="goal-n"><b>${ars(g.ahorrado)}</b><span class="muted"> de ${ars(g.meta)}</span></p>${meter(pct,pct>=100?"good":"")}
      <p class="muted goal-meta">${pct>=100?"¡Objetivo cumplido!":`Faltan ${ars(falta)} · ${Math.round(pct)}%`}
        ${need?`<br>Para llegar a tiempo: <b>${ars(need)}</b> por mes (${left} ${left===1?"mes":"meses"})`:left!=null&&left<=0&&falta>0?`<br><span class="state bad">Se pasó la fecha</span>`:""}
        ${eta?`<br>A tu ritmo de ahorro (${ars(avg)}/mes): ${eta} ${eta===1?"mes":"meses"}`:""}</p>
      <form class="row" style="flex-wrap:nowrap" data-form="aportar" data-i="${i}"><input class="field" style="flex:1;min-width:0" name="monto" inputmode="decimal" placeholder="Monto" required aria-label="Monto a sumar o restar">
        <button class="btn" name="tipo" value="+">Sumar</button><button class="btn" name="tipo" value="-">Restar</button></form>
      <div style="text-align:right;margin-top:var(--s2)"><button class="act ${ui.confirm==="g"+i?"sure":""}" data-act="gdel" data-i="${i}" aria-label="Borrar objetivo">${ui.confirm==="g"+i?"¿Borrar?":svg("trash")}</button></div></article>`};
  return `<section class="card" style="margin-bottom:var(--s5)"><div class="card-head"><h2>Nuevo objetivo</h2></div>
    <form class="row" data-form="goal"><input class="field" style="flex:2 1 200px" name="name" placeholder="Nombre (ej. Fondo de emergencia)" required>
      <input class="field" style="flex:1 1 120px" name="meta" inputmode="decimal" placeholder="Meta" required><input class="field" style="flex:1 1 120px" name="ahorrado" inputmode="decimal" placeholder="Ya ahorrado">
      <input class="field" style="flex:1 1 150px" name="para" type="month" aria-label="Para cuándo (opcional)" title="Para cuándo (opcional)"><button class="btn primary">${svg("plus")}Crear</button></form></section>
  ${G.length?`<div class="grid">${G.map(cardG).join("")}</div>`:`<p class="empty">Todavía no hay objetivos. Creá uno: un viaje, un fondo de emergencia, una compu.</p>`}`;
}

function finProyeccion(){
  const H=S.finanzas.history,now=S.today.slice(0,7),avg=Math.round(avgSaving());
  const ahorro=ui.ahorro??avg,horiz=ui.horiz||12;
  let acc=0;const past=H.map(h=>({m:h.month,v:(acc+=h.net)}));const saldo=acc;
  const shown=past.slice(-12),start=past.length?past.at(-1).m:now;
  const proj=Array.from({length:horiz},(_,k)=>({m:addMonths(start,k+1),v:saldo+ahorro*(k+1),proj:true}));
  ui.projData=[...shown,...proj];
  const goals=S.finanzas.goals.filter(g=>g.ahorrado<g.meta);
  return `<div class="stats"><div class="stat"><span>Saldo acumulado hoy</span><b>${ars(saldo)}</b></div>
    <div class="stat"><span>Ahorro promedio (últimos 3 meses)</span><b class="${avg<0?"neg":""}">${ars(avg)}</b></div>
    <div class="stat"><span>En ${horiz} meses tendrías</span><b class="${saldo+ahorro*horiz<0?"neg":"pos"}">${ars(saldo+ahorro*horiz)}</b></div></div>
  <section class="card"><div class="card-head" style="flex-wrap:wrap"><h2>Saldo acumulado</h2>
    <div class="row" style="align-items:center"><label class="muted" style="font-size:13px">Ahorro por mes <input class="field" style="width:140px;margin-left:var(--s2)" data-input="ahorro" inputmode="decimal" value="${ahorro}"></label>
    <div class="seg">${[12,24,60].map(n=>`<button data-act="horiz" data-v="${n}" aria-pressed="${n===horiz}">${n===60?"5 años":n+" meses"}</button>`).join("")}</div></div></div>
    ${H.length?`<div class="key"><span><i class="k-solid"></i>Real</span><span><i class="k-dash"></i>Proyectado</span></div><div class="chart" data-chart="proj"></div>`:`<p class="muted">Anotá movimientos para ver tu evolución. Mientras tanto, la proyección arranca desde cero.</p><div class="chart" data-chart="proj"></div>`}</section>
  ${goals.length?`<section class="card" style="margin-top:var(--s4)"><div class="card-head"><h2>¿Cuándo llegás a tus objetivos?</h2></div>
    ${goals.map(g=>{const n=ahorro>0?Math.ceil((g.meta-g.ahorrado)/ahorro):null;const late=n&&g.para&&addMonths(now,n)>g.para;
      return `<div class="mov"><span class="t">${esc(g.name)}</span><span class="${late?"state warn":"muted"}" style="margin:0">${n?`${ymLabel(addMonths(now,n))} (${n} ${n===1?"mes":"meses"})${late?" · después de lo planeado":""}`:"Con este ahorro no llegás"}</span></div>`}).join("")}
    <p class="faint" style="font-size:12.5px;margin:var(--s3) 0 0">Si pusieras todo el ahorro mensual en cada objetivo por separado.</p></section>`:""}`;
}

function finInteres(){
  const c=Object.assign({capital:100000,aporte:50000,tasa:30,anios:10,inflacion:0},calc()||{});
  const r=c.tasa/100/12,rows=[];let bal=c.capital,aport=c.capital;
  for(let y=1;y<=Math.min(60,Math.max(1,c.anios));y++){for(let m=0;m<12;m++){bal=bal*(1+r)+c.aporte;aport+=c.aporte}
    rows.push({label:"Año "+y,y,a:aport,b:Math.max(0,bal-aport),total:bal,real:bal/Math.pow(1+c.inflacion/100,y)})}
  ui.ciData=rows;const last=rows.at(-1);
  const f=(k,l,suf)=>`<label class="calc-f"><span>${l}</span><span class="calc-in"><input class="field" data-calc="${k}" inputmode="decimal" value="${c[k]}">${suf?`<i>${suf}</i>`:""}</span></label>`;
  return `<section class="card" style="margin-bottom:var(--s4)"><div class="calc">${f("capital","Capital inicial","$")}${f("aporte","Aporte mensual","$")}${f("tasa","Tasa anual","%")}${f("anios","Años","")}${f("inflacion","Inflación anual (opcional)","%")}</div></section>
  <div class="stats"><div class="stat hero"><span>Valor final en ${last.y} ${last.y===1?"año":"años"}</span><b>${ars(last.total)}</b></div>
    <div class="stat"><span>Total aportado</span><b>${ars(last.a)}</b></div><div class="stat"><span>Intereses ganados</span><b class="pos">${ars(last.b)}</b></div>
    ${c.inflacion>0?`<div class="stat"><span>En plata de hoy</span><b>${ars(last.real)}</b></div>`:""}</div>
  <section class="card"><div class="card-head"><h2>Cómo crece</h2><button class="link" data-act="citable">${ui.ciTable?"Ver gráfico":"Ver tabla"}</button></div>

    :`<div class="key"><span><i style="background:var(--series-1)"></i>Aportado</span><span><i style="background:var(--series-2)"></i>Intereses</span></div><div class="chart" data-chart="ci"></div>`}

/* ---------------- Gráficos (SVG, hover con tooltip) ---------------- */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function axes(W,H,P,lo,hi){let g="";for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=P.t+(H-P.t-P.b)*(1-k/4);
  g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" class="gl"/><text x="${P.l-8}" y="${y+4}" class="ax" text-anchor="end">${compact(v)}</text>`}return g}
function tipAt(el,x,html){let t=el.querySelector(".tip");if(!t){t=document.createElement("div");t.className="tip";el.appendChild(t)}
  t.innerHTML=html;t.style.display="block";const w=t.offsetWidth;t.style.left=Math.min(el.clientWidth-w,Math.max(0,x-w/2))+"px"}
function hideTip(el){const t=el.querySelector(".tip");if(t)t.style.display="none";el.querySelectorAll(".hl").forEach(n=>n.setAttribute("opacity","0"))}
function drawCharts(){
  document.querySelectorAll("[data-chart]").forEach(el=>{
    const W=Math.max(300,el.clientWidth),H=280,P={l:56,r:16,t:16,b:30},n=el.dataset.chart;
    if(n==="ci"){const D=ui.ciData||[],hi=niceMax(Math.max(...D.map(d=>d.a+d.b))),band=(W-P.l-P.r)/D.length,bw=Math.min(24,band*.62);
      const Y=v=>P.t+(H-P.t-P.b)*(1-v/hi),base=Y(0),every=Math.ceil(D.length/10);
      const top=(x,y0,y1,r)=>{r=Math.min(r,(y1-y0)/2,bw/2);return `M${x},${y1}V${y0+r}Q${x},${y0} ${x+r},${y0}H${x+bw-r}Q${x+bw},${y0} ${x+bw},${y0+r}V${y1}Z`};
      let g=axes(W,H,P,0,hi);
      D.forEach((d,i)=>{const x=P.l+band*i+(band-bw)/2,ya=Y(d.a),yb=Y(d.a+d.b),hasB=ya-yb>2.5;
        g+=`<rect class="hl" x="${P.l+band*i}" y="${P.t}" width="${band}" height="${H-P.t-P.b}" opacity="0"/>`;
        g+=hasB?`<rect x="${x}" y="${ya}" width="${bw}" height="${Math.max(0,base-ya)}" fill="var(--series-1)"/><path d="${top(x,yb,ya-2,4)}" fill="var(--series-2)"/>`:`<path d="${top(x,ya,base,4)}" fill="var(--series-1)"/>`;
        if(i%every===0||i===D.length-1)g+=`<text x="${x+bw/2}" y="${H-10}" class="ax" text-anchor="middle">${d.y}</text>`});
      g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${base}" y2="${base}" class="bl"/>`;
      el.innerHTML=`<svg width="${W}" height="${H}" role="img" aria-label="Crecimiento por año: aportado e intereses">${g}</svg>`;
      el.onmousemove=e=>{const i=Math.floor((e.offsetX-P.l)/band);if(i<0||i>=D.length)return hideTip(el);const d=D[i];
        el.querySelectorAll(".hl").forEach((h,k)=>h.setAttribute("opacity",k===i?"1":"0"));
        tipAt(el,P.l+band*(i+.5),`<b>${d.label}</b><span><i style="background:var(--series-2)"></i>Intereses ${ars(d.b)}</span><span><i style="background:var(--series-1)"></i>Aportado ${ars(d.a)}</span><span class="tt">Total ${ars(d.total)}</span>`)};
      el.onmouseleave=()=>hideTip(el);
    }
    if(n==="proj"){const D=ui.projData||[];if(!D.length)return;
      const vs=D.map(d=>d.v),lo=Math.min(0,...vs),hiV=Math.max(0,...vs),hi=niceMax(hiV)||1,low=lo<0?-niceMax(-lo):0;
      const X=i=>P.l+(W-P.l-P.r)*(D.length===1?.5:i/(D.length-1)),Y=v=>P.t+(H-P.t-P.b)*(1-(v-low)/(hi-low));
      const firstProj=D.findIndex(d=>d.proj),realEnd=firstProj<0?D.length-1:Math.max(0,firstProj-1);
      const pts=(a,b)=>D.slice(a,b+1).map((d,k)=>`${X(a+k)},${Y(d.v)}`).join(" ");
      let g=axes(W,H,P,low,hi);const every=Math.ceil(D.length/8);
      D.forEach((d,i)=>{if(i%every===0||i===D.length-1)g+=`<text x="${X(i)}" y="${H-10}" class="ax" text-anchor="middle">${ymLabel(d.m)}</text>`});
      if(firstProj>0)g+=`<polygon points="${X(realEnd)},${Y(low<0?0:low)} ${pts(realEnd,D.length-1)} ${X(D.length-1)},${Y(low<0?0:low)}" fill="var(--series-1)" opacity=".1"/>`;
      if(firstProj!==0)g+=`<polyline points="${pts(0,realEnd)}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if(firstProj>=0)g+=`<polyline points="${pts(Math.max(0,firstProj-1),D.length-1)}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>`;
      const L=D.length-1;g+=`<circle cx="${X(L)}" cy="${Y(D[L].v)}" r="5" fill="var(--series-1)" stroke="var(--panel)" stroke-width="2"/>`;
      g+=`<line class="hl cross" x1="0" x2="0" y1="${P.t}" y2="${H-P.b}" opacity="0"/><circle class="hl dot" r="5" fill="var(--series-1)" stroke="var(--panel)" stroke-width="2" opacity="0"/>`;
      el.innerHTML=`<svg width="${W}" height="${H}" role="img" aria-label="Saldo acumulado real y proyectado">${g}</svg>`;
      el.onmousemove=e=>{const i=Math.round((e.offsetX-P.l)/((W-P.l-P.r)/Math.max(1,L)));if(i<0||i>L)return hideTip(el);const d=D[i];
        const c=el.querySelector(".cross"),o=el.querySelector(".dot");c.setAttribute("x1",X(i));c.setAttribute("x2",X(i));c.setAttribute("opacity","1");
        o.setAttribute("cx",X(i));o.setAttribute("cy",Y(d.v));o.setAttribute("opacity","1");
        tipAt(el,X(i),`<b>${new Date(d.m+"-15").toLocaleDateString("es-AR",{month:"long",year:"numeric"})}</b><span class="tt">${ars(d.v)}</span><span class="faint">${d.proj?"Proyectado":"Real"}</span>`)};
      el.onmouseleave=()=>hideTip(el);
    }
  });
}

    if(k==="invact"){const v=S.finanzas.inversiones[Number(f.dataset.i)];await post("/api/fin",{op:"invact",line:v.line,raw:v.raw,actual:d.actual});toast("Valor actualizado")}
    if(k==="fin"){await post("/api/fin",{op:"add",tipo:ui.tipo||"-",...d});toast("Anotado");document.querySelector('[name="monto"]')?.focus()}
    if(k==="goal"){await post("/api/fin",{op:"goal",...d});toast("Objetivo creado")}
    if(k==="budget"){await post("/api/fin",{op:"budget",...d});toast("Presupuesto guardado")}
    if(k==="aportar"){const g=S.finanzas.goals[Number(f.dataset.i)];await post("/api/fin",{op:"aportar",line:g.line,raw:g.raw,monto:d.monto,tipo:e.submitter?.value||"+"});toast("Objetivo actualizado")}
    if(k==="ficha")await saveFicha({nombre:d.nombre,contacto:d.contacto,cobro:d.cobro,notas:d.notas});
    if(k==="links")await saveFicha({links:[...f.querySelectorAll(".pp-lrow")].map(r=>({label:r.querySelector('[name="label"]').value.trim(),url:r.querySelector('[name="url"]').value.trim()})).filter(l=>l.label||l.url)});
    if(k==="cal"){const r=await fetch("/api/cal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({op:"add",...d})});const j=await r.json();if(!r.ok)return toast(j.error);toast("Conectando…");await loadCal();toast(CAL.errors?.length?"No pude leer el calendario":"Calendario conectado")}
  }catch{}
});
// Arrastrar proyectos en la lista para ordenarlos (soltar en "Fijados" además los fija).
let dragP=null;
document.addEventListener("dragstart",e=>{const r=e.target.closest?.(".prow[data-name]");if(!r)return;dragP=r.dataset.name;r.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragP)});
document.addEventListener("dragover",e=>{if(!dragP)return;const r=e.target.closest?.(".prow[data-name],.pgroup");if(!r)return;e.preventDefault();
  document.querySelectorAll(".drop-before,.drop-after").forEach(x=>x.classList.remove("drop-before","drop-after"));
  if(r.classList.contains("prow")){const b=r.getBoundingClientRect();r.classList.add(e.clientY<b.top+b.height/2?"drop-before":"drop-after")}});
document.addEventListener("dragend",()=>{dragP=null;document.querySelectorAll(".prow.dragging,.drop-before,.drop-after").forEach(x=>x.classList.remove("dragging","drop-before","drop-after"))});
document.addEventListener("drop",async e=>{if(!dragP)return;const tgt=e.target.closest?.(".prow[data-name],.pgroup");if(!tgt)return;e.preventDefault();
  const name=dragP,grp=tgt.closest(".pgroup"),list=JSON.parse(grp.dataset.names).filter(n=>n!==name);
  let at=list.length;if(tgt.classList.contains("prow")&&tgt.dataset.name!==name){const b=tgt.getBoundingClientRect();at=list.indexOf(tgt.dataset.name)+(e.clientY<b.top+b.height/2?0:1)}
  list.splice(at,0,name);dragP=null;
  const rest=(S.order||[]).filter(n=>!list.includes(n));
  try{if(grp.dataset.g==="fijados"&&!S.pinned.includes(name))await post("/api/project",{op:"pin",name});
    if(grp.dataset.g==="arch"&&!S.archived.includes(name))await post("/api/project",{op:"archive",name});
    await post("/api/project",{op:"order",names:[...list,...rest]})}catch{}});
// Para arrastrar tareas entre columnas.
document.addEventListener("dragstart",e=>{const t=e.target.closest?.(".task[data-i]");if(!t)return;dragI=Number(t.dataset.i);t.classList.add("dragging");e.dataTransfer.effectAllowed="move"});
document.addEventListener("dragend",e=>{e.target.closest?.(".task")?.classList.remove("dragging");document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))});
document.addEventListener("dragover",e=>{const c=e.target.closest?.("[data-drop]");if(c&&dragI!=null&&!dragP){e.preventDefault();document.querySelectorAll(".over").forEach(x=>x!==c&&x.classList.remove("over"));c.classList.add("over")}});
document.addEventListener("drop",e=>{const c=e.target.closest?.("[data-drop]");if(!c||dragI==null)return;e.preventDefault();const to=c.dataset.drop,i=dragI;dragI=null;
  if(BOARD[i]&&BOARD[i].bucket!==to)post("/api/task",taskBody(i,{op:"move",to})).then(()=>toast("Movida a "+BK[to])).catch(()=>{});});

// Tema: transición circular desde el botón (View Transitions, curva slow-fast-slow).
function toggleTheme(btn){
  const dark=getComputedStyle(document.documentElement).colorScheme==="dark",next=dark?"light":"dark";
  const apply=()=>{document.documentElement.dataset.theme=next;store.set("panel-theme",next);renderNav()};
  if(!document.startViewTransition||matchMedia("(prefers-reduced-motion:reduce)").matches)return apply();
  const r=btn.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(apply).ready.then(()=>document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:650,easing:"cubic-bezier(.65,0,.35,1)",pseudoElement:"::view-transition-new(root)"}));
}
document.addEventListener("toggle",e=>{const g=e.target.dataset?.g;if(g&&!ui.q){ui.groups[g]=e.target.open;store.set("panel-groups",JSON.stringify(ui.groups))}
  // Pasos de un libro/curso: se dibujan solo al abrir. El <details open> recién dibujado también dispara toggle: ahí no se re-renderiza.
  const l=e.target.dataset?.lib;if(l!=null){if(e.target.open&&ui.libOpen!==l){ui.libOpen=l;render()}else if(!e.target.open&&ui.libOpen===l)ui.libOpen=null}},true);
addEventListener("resize",()=>{clearTimeout(drawCharts.t);drawCharts.t=setTimeout(drawCharts,120)});
addEventListener("hashchange",()=>{ui.editing=null;ui.confirm=null;ui.showDone=false;ui.pEdit=null;ui.histAll=false;render();scrollTo(0,0)});
addEventListener("focus",()=>{if(ui.editing==null&&!ui.pEdit)load()});
renderNav();load();loadCal();setInterval(loadCal,5*60e3);
</script>
